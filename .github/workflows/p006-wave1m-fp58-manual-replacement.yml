name: P-006 Wave 1M FP-58 Manual Replacement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p006-wave1m-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidates:
    name: Build deterministic FP-58 combined graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Validate package manifest and build admin assets
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:package
          npm run build:admin

      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate Wave 1M tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l tools/release/build-distributable.php
          php -l tools/release/build-free-pro-distributables.php
          php -l tools/p006/p006-wave1m-build-manual-order-artifacts.php
          php -l tools/p006/p006-wave1m-runtime-evidence.php
          bash -n tools/p006/p006-wave1m-wordpress-setup.sh
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build canonical package pair
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          cp artifacts/wpessential.zip /tmp/p006-wave1m-canonical-free.zip
          cp artifacts/wpessential-pro.zip /tmp/p006-wave1m-canonical-pro.zip
          sha256sum artifacts/wpessential.zip | tee /tmp/p006-wave1m-canonical-free.sha256
          sha256sum artifacts/wpessential-pro.zip | tee /tmp/p006-wave1m-canonical-pro.sha256

      - name: Rebuild and prove canonical determinism
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          test "$(sha256sum artifacts/wpessential.zip | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/p006-wave1m-canonical-free.sha256)"
          test "$(sha256sum artifacts/wpessential-pro.zip | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/p006-wave1m-canonical-pro.sha256)"
          cmp --silent /tmp/p006-wave1m-canonical-free.zip artifacts/wpessential.zip
          cmp --silent /tmp/p006-wave1m-canonical-pro.zip artifacts/wpessential-pro.zip

      - name: Derive complete FP-58 graph twice
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_CANONICAL_FREE_ZIP: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_CANONICAL_PRO_ZIP: ${{ github.workspace }}/artifacts/wpessential-pro.zip
        run: |
          set -euo pipefail
          rm -rf artifacts/p006-wave1m
          mkdir -p artifacts/p006-wave1m/set-a artifacts/p006-wave1m/set-b

          WPE_P006_OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts/p006-wave1m/set-a" \
            php tools/p006/p006-wave1m-build-manual-order-artifacts.php

          WPE_P006_OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts/p006-wave1m/set-b" \
            php tools/p006/p006-wave1m-build-manual-order-artifacts.php

          for file in f0.zip f1.zip f2.zip p0.zip p1.zip p2.zip candidate-identity.json; do
            cmp --silent "artifacts/p006-wave1m/set-a/${file}" "artifacts/p006-wave1m/set-b/${file}"
          done

          mv artifacts/p006-wave1m/set-a artifacts/p006-wave1m/candidates
          rm -rf artifacts/p006-wave1m/set-b
          test -s artifacts/p006-wave1m/candidates/candidate-identity.json
          cat artifacts/p006-wave1m/candidates/candidate-identity.json

      - name: Upload immutable FP-58 candidate graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1m-candidates-${{ github.run_id }}
          path: |
            artifacts/p006-wave1m/candidates/f0.zip
            artifacts/p006-wave1m/candidates/f1.zip
            artifacts/p006-wave1m/candidates/f2.zip
            artifacts/p006-wave1m/candidates/p0.zip
            artifacts/p006-wave1m/candidates/p1.zip
            artifacts/p006-wave1m/candidates/p2.zip
            artifacts/p006-wave1m/candidates/candidate-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  fp58:
    name: FP-58 / ${{ matrix.cell }} / ${{ matrix.scenario }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: build-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: minimum
            scenario: compatible-free
            baseline_free: F0
            wordpress: '6.9'
            php: '8.2'
          - cell: minimum
            scenario: compatible-pro
            baseline_free: F0
            wordpress: '6.9'
            php: '8.2'
          - cell: minimum
            scenario: breaking-free
            baseline_free: F1
            wordpress: '6.9'
            php: '8.2'
          - cell: minimum
            scenario: breaking-pro
            baseline_free: F1
            wordpress: '6.9'
            php: '8.2'
          - cell: reference
            scenario: compatible-free
            baseline_free: F0
            wordpress: '7.1'
            php: '8.5'
          - cell: reference
            scenario: compatible-pro
            baseline_free: F0
            wordpress: '7.1'
            php: '8.5'
          - cell: reference
            scenario: breaking-free
            baseline_free: F1
            wordpress: '7.1'
            php: '8.5'
          - cell: reference
            scenario: breaking-pro
            baseline_free: F1
            wordpress: '7.1'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_CELL_ID: ${{ matrix.cell }}
      WPE_P006_SCENARIO: ${{ matrix.scenario }}
      WPE_P006_BASE_FREE_NODE: ${{ matrix.baseline_free }}
      WPE_P006_BASE_PRO_NODE: P0
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1m/candidates
      WPE_P006_F0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/f0.zip
      WPE_P006_F1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/f1.zip
      WPE_P006_F2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/f2.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/p0.zip
      WPE_P006_P1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/p1.zip
      WPE_P006_P2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/p2.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1m/candidates/candidate-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1m/evidence/${{ matrix.cell }}/${{ matrix.scenario }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1m-${{ matrix.cell }}-${{ matrix.scenario }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none

      - name: Download exact FP-58 candidate graph
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1m-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1m/candidates

      - name: Verify FP-58 inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in f0.zip f1.zip f2.zip p0.zip p1.zip p2.zip candidate-identity.json; do
            test -s "artifacts/p006-wave1m/candidates/${file}"
          done
          php -l tools/p006/p006-wave1m-runtime-evidence.php
          bash -n tools/p006/p006-wave1m-wordpress-setup.sh

      - name: Prepare disposable WordPress baseline package pair
        shell: bash
        run: bash tools/p006/p006-wave1m-wordpress-setup.sh

      - name: Activate baseline
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: prepare
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1m-runtime-evidence.php
          test -s "${WPE_P006_EVIDENCE_DIR}/prepare.json"

      - name: Fresh-process baseline observation
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: baseline
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1m-runtime-evidence.php
          test -s "${WPE_P006_EVIDENCE_DIR}/baseline.json"

      - name: Execute WordPress-owned manual ZIP overwrite
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: overwrite
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1m-runtime-evidence.php
          test -s "${WPE_P006_EVIDENCE_DIR}/overwrite.json"

      - name: Fresh-process post-overwrite FP-58 observation
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: after
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1m-runtime-evidence.php
          test -s "${WPE_P006_EVIDENCE_DIR}/after.json"

      - name: Aggregate FP-58 scenario evidence
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: aggregate
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1m-runtime-evidence.php
          test -s "${WPE_P006_EVIDENCE_DIR}/summary.json"
          cat "${WPE_P006_EVIDENCE_DIR}/summary.json"

      - name: Upload immutable FP-58 scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1m-fp58-${{ matrix.cell }}-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1m/candidates/candidate-identity.json
            artifacts/p006-wave1m/evidence/${{ matrix.cell }}/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  fp58-terminal:
    name: FP-58 terminal aggregate
    needs: [build-candidates, fp58]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Record formal FP-58 matrix terminal result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p006-wave1m/terminal
          cat > artifacts/p006-wave1m/terminal/fp58-terminal.json <<'JSON'
          {
            "status": "PASS",
            "fixture_id": "FP-58",
            "classification": "FORMAL BOUNDED P-006 EVIDENCE",
            "authorized_paths": [
              "minimum/compatible-free",
              "minimum/compatible-pro",
              "minimum/breaking-free",
              "minimum/breaking-pro",
              "reference/compatible-free",
              "reference/compatible-pro",
              "reference/breaking-free",
              "reference/breaking-pro"
            ],
            "all_matrix_jobs_required_success": true,
            "executed_fixture_count_increment_if_merged": 1,
            "pass_fixture_count_increment_if_merged": 1,
            "pair_certified": false,
            "runtime_certified": false,
            "updater_or_tuf_certified": false,
            "rollback_or_migration_certified": false,
            "partial_or_interrupted_replacement_certified": false,
            "adr_0010": "Proposed",
            "ga_or_release_authorized": false
          }
          JSON
          cat artifacts/p006-wave1m/terminal/fp58-terminal.json

      - name: Upload FP-58 terminal marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1m-fp58-terminal-${{ github.run_id }}
          path: artifacts/p006-wave1m/terminal/fp58-terminal.json
          if-no-files-found: error
          retention-days: 14
