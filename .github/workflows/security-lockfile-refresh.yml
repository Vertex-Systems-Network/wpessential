name: Security Lockfile Refresh

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-lockfile-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Generate minimal admin toolchain candidate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package-before.json
          cp package-lock.json package-lock-before.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          p.devDependencies = {
            '@biomejs/biome': '2.5.15',
            'esbuild': '0.28.2',
            'sass': '1.105.1',
            'typescript': 'npm:@typescript/typescript6@6.0.2'
          };
          delete p.overrides;
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const p = require('./package.json');
          const expected = {
            '@biomejs/biome': '2.5.15',
            'esbuild': '0.28.2',
            'sass': '1.105.1',
            'typescript': 'npm:@typescript/typescript6@6.0.2'
          };
          if (JSON.stringify(p.devDependencies) !== JSON.stringify(expected)) {
            throw new Error('unexpected candidate dev dependency graph: ' + JSON.stringify(p.devDependencies));
          }
          if (p.overrides !== undefined) {
            throw new Error('candidate graph must not inherit stale overrides');
          }
          NODE

      - name: Audit refreshed dev graph
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-after.json
          echo "dev_audit_exit=$?" >> "$GITHUB_ENV"
          npm audit --omit=dev --audit-level=high --json > npm-audit-distributable-after.json
          echo "prod_audit_exit=$?" >> "$GITHUB_ENV"
          set -e
          cat npm-audit-after.json
          cat npm-audit-distributable-after.json

      - name: Capture candidate dependency graph report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};
          const names = ['braces', 'micromatch', 'fast-glob', 'stylelint', 'webpack-dev-server', '@wordpress/scripts'];
          const matches = {};
          for (const name of names) {
            matches[name] = [];
          }
          for (const [path, meta] of Object.entries(packages)) {
            for (const name of names) {
              const suffix = '/node_modules/' + name;
              const top = 'node_modules/' + name;
              if (path === top || path.endsWith(suffix)) {
                matches[name].push({
                  path,
                  version: meta.version || null
                });
              }
            }
          }
          fs.writeFileSync(
            'candidate-graph-report.json',
            JSON.stringify({
              package_count: Object.keys(packages).length,
              candidate_dev_dependencies: require('./package.json').devDependencies,
              affected_chain_packages: matches
            }, null, 2) + '\n'
          );
          console.log(fs.readFileSync('candidate-graph-report.json', 'utf8'));
          NODE

      - name: Upload refreshed lockfile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-lockfile-refresh-${{ github.run_id }}
          path: |
            package-before.json
            package-lock-before.json
            package.json
            package-lock.json
            npm-audit-after.json
            npm-audit-distributable-after.json
            candidate-graph-report.json
          if-no-files-found: error
          retention-days: 2
