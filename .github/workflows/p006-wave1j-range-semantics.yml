name: P-006 Wave 1J Pure Range Semantics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p006-wave1j-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidates:
    name: Build and pin Wave 1J candidates/source
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Validate package manifest and build admin assets
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:package
          npm run build:admin

      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate Wave 1J tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l frameworks/Modules/Compatibility/LocalCompatibilityPreflight.php
          php -l tools/release/build-distributable.php
          php -l tools/p006/p006-wave1j-range-semantics.php
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build first immutable candidate set
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          cp artifacts/wpessential.zip /tmp/p006-wave1j-free-first.zip
          cp artifacts/wpessential-pro.zip /tmp/p006-wave1j-pro-first.zip
          sha256sum artifacts/wpessential.zip | tee /tmp/p006-wave1j-free-first.sha256
          sha256sum artifacts/wpessential-pro.zip | tee /tmp/p006-wave1j-pro-first.sha256

      - name: Rebuild and prove deterministic candidates
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          free_first="$(cut -d' ' -f1 /tmp/p006-wave1j-free-first.sha256)"
          pro_first="$(cut -d' ' -f1 /tmp/p006-wave1j-pro-first.sha256)"
          free_second="$(sha256sum artifacts/wpessential.zip | cut -d' ' -f1)"
          pro_second="$(sha256sum artifacts/wpessential-pro.zip | cut -d' ' -f1)"
          test "${free_first}" = "${free_second}"
          test "${pro_first}" = "${pro_second}"
          cmp --silent /tmp/p006-wave1j-free-first.zip artifacts/wpessential.zip
          cmp --silent /tmp/p006-wave1j-pro-first.zip artifacts/wpessential-pro.zip

      - name: Record exact Wave 1J identities before fixtures
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
          WPE_P006_PREFLIGHT_SOURCE_PATH: ${{ github.workspace }}/frameworks/Modules/Compatibility/LocalCompatibilityPreflight.php
          WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1j/candidate-identity.json
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1j-range-semantics.php identity
          test -s artifacts/p006-wave1j/candidate-identity.json
          cat artifacts/p006-wave1j/candidate-identity.json

      - name: Upload immutable Wave 1J identities/candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1j-candidates-${{ github.run_id }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential-pro.zip
            artifacts/p006-wave1j/candidate-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  pure-range-evidence:
    name: FP-61…68/76 / PHP ${{ matrix.php }}
    needs: build-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
      WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
      WPE_P006_PREFLIGHT_SOURCE_PATH: ${{ github.workspace }}/frameworks/Modules/Compatibility/LocalCompatibilityPreflight.php
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1j/candidate-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1j/php-${{ matrix.php }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      - name: Download exact immutable candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1j-candidates-${{ github.run_id }}
          path: artifacts

      - name: Verify downloaded identity inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          test -s artifacts/p006-wave1j/candidate-identity.json
          php -l tools/p006/p006-wave1j-range-semantics.php

      - name: Execute pure local FP-61…68/76 twice deterministically
        shell: bash
        run: |
          set -euo pipefail
          WPE_P006_EXECUTION_MODE=execute php tools/p006/p006-wave1j-range-semantics.php
          test -s "${WPE_P006_EVIDENCE_DIR}/summary.json"
          cat "${WPE_P006_EVIDENCE_DIR}/summary.json"

      - name: Upload Wave 1J PHP-cell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1j-php-${{ matrix.php }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1j/candidate-identity.json
            artifacts/p006-wave1j/php-${{ matrix.php }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
