name: CI Complete

# Most workflows only run when their paths change, so none of them can be a required check on
# their own. This job runs on every pull request, waits for every other check on the exact head
# commit to finish, and fails if any failed. The main ruleset requires this one check.
on:
  pull_request:

permissions:
  checks: read
  contents: read

jobs:
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Wait for every check on the head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Give path-filtered workflows time to queue their check runs before the first look.
          sleep 90
          while true; do
            runs="$(gh api --paginate "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != "ci-complete") | [.name, .status, (.conclusion // "")] | @tsv')"
            pending="$(printf '%s\n' "${runs}" | awk -F'\t' '$2 != "completed" && $1 != ""' | wc -l)"
            failed="$(printf '%s\n' "${runs}" | awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "skipped" && $3 != "neutral" && $1 != ""')"
            if [ -n "${failed}" ]; then
              echo "Checks that did not pass:"
              printf '%s\n' "${failed}"
              exit 1
            fi
            if [ "${pending}" -eq 0 ]; then
              echo "All checks on ${HEAD_SHA} passed:"
              printf '%s\n' "${runs}"
              exit 0
            fi
            echo "Waiting for ${pending} check(s)..."
            sleep 30
          done
