name: P-006 Wave 1R FP-21 FP-22 Overlap Boot

on:
  pull_request:
    paths:
      - '.github/workflows/p006-wave1r-fp21-fp22-overlap-boot.yml'
      - 'tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php'
      - 'tools/p006/p006-wave1k-build-overlap-artifacts.php'
      - 'tools/p006/p006-wave1k-wordpress-setup.sh'
      - 'tools/p006/p006-wave1k-swap-plugin.sh'
      - 'tools/release/build-distributable.php'
      - 'tools/release/build-free-pro-distributables.php'
      - 'frameworks/Modules/Compatibility/**'
      - 'frameworks/Bootstrap/Plugin.php'
      - 'frameworks/Platform/Entitlements/**'
      - 'frameworks/Platform/Modules/**'
      - 'wpessential.php'
      - 'wpessential-pro.php'
      - 'package.json'
      - 'package-lock.json'
      - 'admin-ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p006-wave1r-fp21-fp22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-gate:
    name: Wave 1R latest-change gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_runtime: ${{ steps.gate.outputs.run_runtime }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether latest change requires runtime
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_runtime=true

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "synchronize" ] && [ -n "${BEFORE_SHA:-}" ]; then
            git cat-file -e "${BEFORE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            printf 'Latest synchronize changed files:\n'
            printf ' - %s\n' "${changed[@]}"

            run_runtime=false
            for path in "${changed[@]}"; do
              case "$path" in
                .github/workflows/p006-wave1r-fp21-fp22-overlap-boot.yml|\
                tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php|\
                tools/p006/p006-wave1k-build-overlap-artifacts.php|\
                tools/p006/p006-wave1k-wordpress-setup.sh|\
                tools/p006/p006-wave1k-swap-plugin.sh|\
                tools/release/build-distributable.php|\
                tools/release/build-free-pro-distributables.php|\
                frameworks/Modules/Compatibility/*|\
                frameworks/Bootstrap/Plugin.php|\
                frameworks/Platform/Entitlements/*|\
                frameworks/Platform/Modules/*|\
                wpessential.php|wpessential-pro.php|package.json|package-lock.json|admin-ui/*)
                  run_runtime=true
                  break
                  ;;
              esac
            done
          fi

          echo "run_runtime=$run_runtime" >> "$GITHUB_OUTPUT"
          echo "Wave 1R heavy runtime required: $run_runtime"

  build-candidates:
    name: Build deterministic Wave 1R overlap graph
    needs: change-gate
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Build admin assets
        run: |
          set -euo pipefail
          npm run lint:package
          npm run build:admin

      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate Wave 1R tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l tools/release/build-distributable.php
          php -l tools/p006/p006-wave1k-build-overlap-artifacts.php
          php -l tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php
          bash -n tools/p006/p006-wave1k-wordpress-setup.sh
          bash -n tools/p006/p006-wave1k-swap-plugin.sh
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build canonical package pair
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          cp artifacts/wpessential.zip /tmp/p006-wave1r-canonical-free.zip
          cp artifacts/wpessential-pro.zip /tmp/p006-wave1r-canonical-pro.zip

      - name: Rebuild and prove canonical determinism
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          cmp --silent /tmp/p006-wave1r-canonical-free.zip artifacts/wpessential.zip
          cmp --silent /tmp/p006-wave1r-canonical-pro.zip artifacts/wpessential-pro.zip

      - name: Derive deterministic overlap graph twice
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_CANONICAL_FREE_ZIP: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_CANONICAL_PRO_ZIP: ${{ github.workspace }}/artifacts/wpessential-pro.zip
        run: |
          set -euo pipefail
          rm -rf artifacts/p006-wave1r
          mkdir -p artifacts/p006-wave1r/set-a artifacts/p006-wave1r/set-b
          WPE_P006_OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts/p006-wave1r/set-a" php tools/p006/p006-wave1k-build-overlap-artifacts.php
          WPE_P006_OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts/p006-wave1r/set-b" php tools/p006/p006-wave1k-build-overlap-artifacts.php
          for file in f0.zip f1.zip p0.zip p1.zip candidate-identity.json; do
            cmp --silent "artifacts/p006-wave1r/set-a/${file}" "artifacts/p006-wave1r/set-b/${file}"
          done
          mv artifacts/p006-wave1r/set-a artifacts/p006-wave1r/candidates
          rm -rf artifacts/p006-wave1r/set-b

      - name: Normalize Wave 1R formal authority boundary
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            protocol: "P-006",
            wave: "1R-fp21-fp22-overlap-boot",
            source_sha: .source_sha,
            temporary_approval_id: "GOV-P001-CF-TEMP-016",
            authorization: "GOV-P001-CF-TEMP-016",
            authorized_fixtures: ["FP-21","FP-22"],
            classification: "FORMAL FP-21 + FP-22 EVIDENCE / NON-CERTIFYING",
            historical_graph_reuse: {
              source_wave: .wave,
              historical_authority_reused: false,
              note: "Wave 1K graph builder is reused only as a deterministic overlap-artifact construction primitive."
            },
            nodes: {F0:.nodes.F0,F1:.nodes.F1,P0:.nodes.P0,P1:.nodes.P1},
            pairs: {F0_P0:.pairs.F0_P0,F1_P0:.pairs.F1_P0,F0_P1:.pairs.F0_P1},
            local_entitlement: {state:"pro_active",remote_provider:false},
            boundaries: {
              fp24_executed:false,
              fp33_executed:false,
              product_runtime_source_modified:false,
              provider_or_remote_entitlement_used:false,
              updater_or_tuf_certified:false,
              pair_certified:false,
              runtime_certified:false,
              adr_0010:"Proposed"
            }
          }' artifacts/p006-wave1r/candidates/candidate-identity.json > artifacts/p006-wave1r/candidates/wave1r-identity.json

          test "$(jq -r '.temporary_approval_id' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "GOV-P001-CF-TEMP-016"
          test "$(jq -r '.nodes.F1.metadata.version' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "0.1.1-test-overlap"
          test "$(jq -r '.nodes.P0.metadata.version' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "0.1.0-dev"
          test "$(jq -r '.nodes.F0.metadata.version' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "0.1.0-dev"
          test "$(jq -r '.nodes.P1.metadata.version' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "0.1.1-test-overlap"
          test "$(jq -r '.pairs.F1_P0.expected_state' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "compatible"
          test "$(jq -r '.pairs.F0_P1.expected_state' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "compatible"
          cat artifacts/p006-wave1r/candidates/wave1r-identity.json

      - name: Upload immutable Wave 1R candidate graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1r-candidates-${{ github.run_id }}
          path: |
            artifacts/p006-wave1r/candidates/f0.zip
            artifacts/p006-wave1r/candidates/f1.zip
            artifacts/p006-wave1r/candidates/p0.zip
            artifacts/p006-wave1r/candidates/p1.zip
            artifacts/p006-wave1r/candidates/wave1r-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  overlap:
    name: FP-21 + FP-22 / ${{ matrix.cell }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: [change-gate, build-candidates]
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: minimum
            wordpress: '6.9'
            php: '8.2'
          - cell: reference
            wordpress: '7.1'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1r/candidates
      WPE_P006_F0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1r/candidates/f0.zip
      WPE_P006_F1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1r/candidates/f1.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1r/candidates/p0.zip
      WPE_P006_P1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1r/candidates/p1.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1r/candidates/wave1r-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1r/evidence/${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1r-${{ matrix.cell }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none

      - name: Download exact Wave 1R graph
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1r-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1r/candidates

      - name: Validate Wave 1R inputs
        run: |
          set -euo pipefail
          for file in f0.zip f1.zip p0.zip p1.zip wave1r-identity.json; do
            test -s "artifacts/p006-wave1r/candidates/${file}"
          done
          test "$(jq -r '.temporary_approval_id' artifacts/p006-wave1r/candidates/wave1r-identity.json)" = "GOV-P001-CF-TEMP-016"
          php -l tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php
          bash -n tools/p006/p006-wave1k-wordpress-setup.sh
          bash -n tools/p006/p006-wave1k-swap-plugin.sh

      - name: Prepare disposable WordPress F0 P0 baseline
        run: bash tools/p006/p006-wave1k-wordpress-setup.sh

      - name: Activate baseline pair
        env:
          WPE_P006_EXECUTION_MODE: prepare
        run: php tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php

      - name: Switch Free to exact F1
        env:
          WPE_P006_SWAP_PLUGIN: free
          WPE_P006_SWAP_TARGET: f1a
        run: bash tools/p006/p006-wave1k-swap-plugin.sh

      - name: Execute FP-21 F1 P0 overlap boot
        env:
          WPE_P006_EXECUTION_MODE: observe
          WPE_P006_EXPECTED_FREE_NODE: F1
          WPE_P006_EXPECTED_PRO_NODE: P0
          WPE_P006_EXPECTED_FREE_INSTANCE: f1a
          WPE_P006_EXPECTED_PRO_INSTANCE: p0
          WPE_P006_FIXTURE_ID: FP-21
          WPE_P006_PHASE: newer-free-older-pro-overlap
          WPE_P006_EVIDENCE_FILE: fp21.json
        run: php tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php

      - name: Reset Free to F0
        env:
          WPE_P006_SWAP_PLUGIN: free
          WPE_P006_SWAP_TARGET: f0
        run: bash tools/p006/p006-wave1k-swap-plugin.sh

      - name: Switch Pro to exact P1
        env:
          WPE_P006_SWAP_PLUGIN: pro
          WPE_P006_SWAP_TARGET: p1
        run: bash tools/p006/p006-wave1k-swap-plugin.sh

      - name: Execute FP-22 F0 P1 overlap boot
        env:
          WPE_P006_EXECUTION_MODE: observe
          WPE_P006_EXPECTED_FREE_NODE: F0
          WPE_P006_EXPECTED_PRO_NODE: P1
          WPE_P006_EXPECTED_FREE_INSTANCE: f0
          WPE_P006_EXPECTED_PRO_INSTANCE: p1
          WPE_P006_FIXTURE_ID: FP-22
          WPE_P006_PHASE: older-free-newer-pro-overlap
          WPE_P006_EVIDENCE_FILE: fp22.json
        run: php tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php

      - name: Aggregate FP-21 and FP-22
        env:
          WPE_P006_EXECUTION_MODE: aggregate
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1r-fp21-fp22-overlap-boot.php
          test -s "${WPE_P006_EVIDENCE_DIR}/summary.json"
          cat "${WPE_P006_EVIDENCE_DIR}/summary.json"

      - name: Upload immutable Wave 1R runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1r-${{ matrix.cell }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1r/candidates/wave1r-identity.json
            artifacts/p006-wave1r/evidence/${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  terminal:
    name: Wave 1R terminal aggregate
    needs: [change-gate, build-candidates, overlap]
    if: always() && needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build-candidates.result }}
      OVERLAP_RESULT: ${{ needs.overlap.result }}
    steps:
      - name: Record terminal result
        run: |
          set -euo pipefail
          status=FAIL
          if [ "$BUILD_RESULT" = "success" ] && [ "$OVERLAP_RESULT" = "success" ]; then
            status=PASS
          fi
          mkdir -p artifacts/p006-wave1r/terminal
          jq -n             --arg status "$status"             --arg build "$BUILD_RESULT"             --arg runtime "$OVERLAP_RESULT"             '{
              status:$status,
              protocol:"P-006",
              wave:"1R",
              fixtures:["FP-21","FP-22"],
              authorization:"GOV-P001-CF-TEMP-016",
              classification:"FORMAL FP-21 + FP-22 EVIDENCE / NON-CERTIFYING",
              build_result:$build,
              runtime_matrix_result:$runtime,
              required_runtime_cells:["minimum","reference"],
              local_entitlement_state:"pro_active",
              provider_or_remote_entitlement_used:false,
              accounting_if_pass:{documented:144,executed:52,pass:51,fail:0,inconclusive:1},
              fp24_state:"N_A_CURRENT_ACCEPTED_CONTRACT_NOT_EXECUTED",
              fp33_state:"INCONCLUSIVE_NOT_EXECUTED_IN_WAVE_1R",
              pair_certified:false,
              runtime_certified:false,
              updater_or_tuf_certified:false,
              adr_0010:"Proposed",
              ga_or_release_authorized:false
            }' > artifacts/p006-wave1r/terminal/terminal.json
          cat artifacts/p006-wave1r/terminal/terminal.json

      - name: Upload terminal marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1r-terminal-${{ github.run_id }}
          path: artifacts/p006-wave1r/terminal/terminal.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce terminal success
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = "success"
          test "$OVERLAP_RESULT" = "success"
