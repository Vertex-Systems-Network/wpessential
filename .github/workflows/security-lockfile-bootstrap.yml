name: Security Lockfile Bootstrap Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/security-lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/node-dev-dependency-remediation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted security branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify fixed branch and exact source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: security/node-dev-dependency-remediation-v1
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "${EXPECTED_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${GITHUB_REPOSITORY}"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Verify reviewed manifest inputs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json');
          const expected = {
            'adm-zip': '0.6.1',
            'serialize-javascript': '7.1.1',
            'markdownlint-cli': '0.49.1',
            'qs': '6.16.0',
            'uuid': '11.1.1',
          };
          if (p.devDependencies?.['@wordpress/scripts'] !== '35.0.0') throw new Error('unexpected @wordpress/scripts');
          if (p.devDependencies?.typescript !== 'npm:@typescript/typescript6@6.0.2') throw new Error('unexpected TypeScript alias');
          if (p.engines?.node !== '>=24 <25' || p.engines?.npm !== '>=10 <12') throw new Error('engine contract drift');
          if (JSON.stringify(p.overrides) !== JSON.stringify(expected)) throw new Error('reviewed overrides drift');
          NODE

      - name: Regenerate accepted lockfile with lifecycle scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "21df94114960fa8aedc0b34153a73eed0dec04cdb90575d48003dcaa66669944"
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Commit lockfile and remove temporary write workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/security-lockfile-bootstrap.yml
          git config user.name 'wpessential-security-bot'
          git config user.email 'security-bot@users.noreply.github.com'
          git add package-lock.json .github/workflows/security-lockfile-bootstrap.yml
          git diff --cached --exit-code && { echo 'Expected lock/bootstrap diff missing'; exit 1; } || true
          git commit -m 'security: lock zero-vulnerability Node graph'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
