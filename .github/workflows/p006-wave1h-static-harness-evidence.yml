name: P-006 Wave 1H Static Harness Evidence

on:
  pull_request:
    paths:
      - 'frameworks/Modules/Compatibility/**'
      - 'wpessential.php'
      - 'wpessential-pro.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'admin-ui/**'
      - 'tools/release/build-distributable.php'
      - 'tools/release/build-free-pro-distributables.php'
      - 'tools/p006/p006-wave1h-static-harness-evidence.php'
      - '.github/workflows/p006-wave1h-static-harness-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p006-wave1h-static-harness-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Validate package manifest and build production admin assets
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:package
          npm run build:admin
          for entry in main taxonomy fields columns-runtime; do
            test -s "assets/admin/${entry}.js"
            test -s "assets/admin/${entry}.css"
            test -s "assets/admin/${entry}.asset.php"
          done

      - name: Set up PHP 8.2 evidence runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate packaging and Wave 1H harness syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l wpessential.php
          php -l wpessential-pro.php
          php -l frameworks/Modules/Compatibility/LocalCompatibilityPreflight.php
          php -l tools/release/build-distributable.php
          php -l tools/release/build-free-pro-distributables.php
          php -l tools/p006/p006-wave1h-static-harness-evidence.php
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build deterministic immutable Wave 1H candidates
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          for artifact in \
            artifacts/wpessential.zip \
            artifacts/wpessential-package.json \
            artifacts/wpessential-pro.zip \
            artifacts/wpessential-pro-package.json
          do
            test -s "${artifact}"
          done
          sha256sum artifacts/wpessential.zip
          sha256sum artifacts/wpessential-pro.zip

      - name: Execute authorized P-006 Wave 1H fixtures
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          set +e
          php tools/p006/p006-wave1h-static-harness-evidence.php
          harness_exit=$?
          set -e
          if [ "${harness_exit}" -ne 2 ]; then
            echo "Expected Wave 1H STOP/REVIEW exit 2 for the authorized FP-33 lifecycle-owner discovery; got ${harness_exit}" >&2
            exit 1
          fi
          test -s artifacts/p006-wave1h-static-harness-evidence.json
          php -r '
            $e = json_decode(file_get_contents("artifacts/p006-wave1h-static-harness-evidence.json"), true, flags: JSON_THROW_ON_ERROR);
            $summary = $e["summary"] ?? [];
            if (($e["grant"] ?? null) !== "GOV-P001-CF-TEMP-006") {
              fwrite(STDERR, "Unexpected Wave 1H grant\n");
              exit(1);
            }
            if (($summary["executed"] ?? null) !== 7 || ($summary["passed"] ?? null) !== 6 || ($summary["failed"] ?? null) !== 0 || ($summary["inconclusive"] ?? null) !== 1) {
              fwrite(STDERR, "Unexpected P-006 Wave 1H terminal summary; expected 6 PASS / 0 FAIL / 1 INCONCLUSIVE\n");
              exit(1);
            }
            $fixtures = $e["fixtures"] ?? [];
            $ids = array_column($fixtures, "fixture_id");
            if ($ids !== ["FP-29", "FP-30", "FP-31", "FP-33", "FP-40", "FP-41", "FP-42"]) {
              fwrite(STDERR, "Unexpected P-006 Wave 1H fixture set\n");
              exit(1);
            }
            $byId = [];
            foreach ($fixtures as $fixture) {
              $byId[$fixture["fixture_id"] ?? ""] = $fixture;
            }
            foreach (["FP-29", "FP-30", "FP-31", "FP-40", "FP-41", "FP-42"] as $id) {
              if (($byId[$id]["status"] ?? null) !== "PASS") {
                fwrite(STDERR, "Expected {$id} PASS\n");
                exit(1);
              }
            }
            $fp33 = $byId["FP-33"] ?? null;
            if (!is_array($fp33) || ($fp33["status"] ?? null) !== "INCONCLUSIVE") {
              fwrite(STDERR, "FP-33 must be the sole INCONCLUSIVE STOP/REVIEW fixture\n");
              exit(1);
            }
            $markers = $fp33["actual"]["lifecycle_owner_markers"] ?? [];
            if (!is_array($markers) || $markers === []) {
              fwrite(STDERR, "FP-33 STOP/REVIEW requires concrete lifecycle-owner markers\n");
              exit(1);
            }
            $assertions = $fp33["assertions"] ?? [];
            if (($assertions["no_activation_or_migration_owner_marker"] ?? null) !== false || ($assertions["incompatible_decision_denies_boot"] ?? null) !== true || ($assertions["incompatible_decision_denies_migrations"] ?? null) !== true) {
              fwrite(STDERR, "FP-33 lifecycle-owner/fail-closed evidence mismatch\n");
              exit(1);
            }
            if (($fp33["failed_assertions"] ?? null) !== ["no_activation_or_migration_owner_marker"]) {
              fwrite(STDERR, "FP-33 must stop only on lifecycle-owner discovery\n");
              exit(1);
            }
            $boundaries = $e["boundaries"] ?? [];
            foreach (["real_wordpress_runtime_executed", "provider_or_license_calls_executed", "production_credentials_or_live_sites_used", "destructive_or_irreversible_operations_executed", "deployment_or_release_executed", "permanent_p001_cf_promoted", "pair_certification_promoted", "runtime_certification_promoted", "adr_0010_promoted"] as $key) {
              if (($boundaries[$key] ?? null) !== false) {
                fwrite(STDERR, "Wave 1H non-certifying boundary violation: {$key}\n");
                exit(1);
              }
            }
          '
          cat artifacts/p006-wave1h-static-harness-evidence.json

      - name: Upload immutable candidates and Wave 1H evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1h-static-harness-evidence-${{ github.run_id }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential-package.json
            artifacts/wpessential-pro.zip
            artifacts/wpessential-pro-package.json
            artifacts/p006-wave1h-static-harness-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
