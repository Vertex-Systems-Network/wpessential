name: Reconcile Gate D after 237

on:
  push:
    branches:
      - supervisor/gate-d-after-237
    paths:
      - .github/workflows/reconcile-gate-d-after-237.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout supervisor branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: supervisor/gate-d-after-237
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "wpessential-supervisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile coordination queue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/coordination/agent-work-queue.json')
          data = json.loads(path.read_text())
          anchor = '6c1740de53cd1f25f03d489f2e8d0687e09de3d2'
          data['snapshot_date'] = '2026-09-07'
          data['queue_anchor_main_sha'] = anchor
          data['authoritative_rule'] = (
              'Refresh exact main before selecting work. Gates A/B/C PASS bounded V1; Gate D ACTIVE / NOT PASS. '
              'PR #237 is promoted with exact-head CI green and Issue #232 completed. Two non-overlapping dependency-ready lanes are now OPEN: '
              'Issue #280 bounded owner-routed Fields bulk edit V1 and Issue #281 post-#237 exact-main remaining-gap audit V3. '
              'No other worker lane is authorized until V3 evidence or later Supervisor reconciliation opens it. Gate E and Status remain blocked. '
              'Deterministic branch creation is the claim lock; no force/reuse. Queue/README/CHECKPOINT are Supervisor-only.'
          )
          data['auto_assignment']['revalidation_before_work'] = [
              'Read AGENTS.md, CONTRIBUTING.md, CHECKPOINT.md and docs/ENGINEERING-EXECUTION-GOVERNANCE.md.',
              f'Resolve exact current main at or after {anchor}; verify PR #237 merged and Issue #232 completed.',
              'Inspect current OPEN claims/dependencies; preserve Query/source-owner/Policy boundaries before deterministic branch creation.'
          ]

          slots = {slot['slot_id']: slot for slot in data['slots']}
          inline = slots['columns-fields-inline-edit-ui-v1']
          inline.update({
              'status': 'DONE',
              'work_mode': 'HISTORICAL',
              'parallel_class': 'HISTORICAL_COMPLETED',
              'source': 'Issue #232 / merged PR #237',
              'dependencies': [],
              'runtime_allowed': True,
              'allowed_scope': ['Historical completed boundary only'],
              'completion_condition': 'Promoted exact-head green via PR #237.',
              'notes': 'Do not reuse completed branch.'
          })

          bulk = slots['columns-fields-bulk-edit-v1']
          bulk.update({
              'status': 'OPEN',
              'source': 'Issue #280 / parent #66',
              'dependencies': ['columns-fields-inline-edit-ui-v1 promoted via PR #237'],
              'allowed_scope': [
                  'Admin Columns bounded bulk mutation/UI composition only',
                  'reuse certified owner-routed Fields mutation seam and explicit visible post.id identities',
                  'focused tests/doc; hard finite row budget and truthful partial-failure outcomes',
                  'no other-owner mutation/export/shared truth/CI/lockfile changes'
              ],
              'completion_condition': 'Bounded owner-routed Fields bulk edit is exact-head green and promoted.',
              'notes': 'Dependency is satisfied by merged PR #237. Preserve per-row Policy/source-owner authorization and fail closed.'
          })

          audit_id = 'columns-gate-d-post-237-gap-audit-v3'
          if audit_id not in slots:
              data['slots'].append({
                  'priority': 125,
                  'slot_id': audit_id,
                  'title': 'Post-#237 exact-main Gate D remaining-gap audit V3',
                  'role': 'ANY',
                  'status': 'OPEN',
                  'work_mode': 'EVIDENCE_RECONCILIATION',
                  'parallel_class': 'COLUMNS_GAP_AUDIT_DOCS_ONLY',
                  'claim_mechanism': 'DETERMINISTIC_REMOTE_BRANCH_CREATE',
                  'source': 'Issue #281 / parent #66',
                  'dependencies': ['PR #237 promoted'],
                  'runtime_allowed': False,
                  'allowed_scope': ['Exactly one new file: docs/IMPLEMENTATION/ADMIN-COLUMNS-GATE-D-REMAINING-GAP-AUDIT-V3.md'],
                  'completion_condition': 'Exact-main evidence reclassifies remaining Gate D gaps and safe parallel lanes without a PASS claim.',
                  'notes': 'Must not edit runtime, tests, queue, README, CHECKPOINT, CI/build or lockfiles.',
                  'claim_branch': 'agent/columns-gate-d-post-237-gap-audit-v3'
              })

          data['slots'].sort(key=lambda slot: slot['priority'])
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          PY

      - name: Verify queue contract and remove helper
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/coordination/agent-work-queue.json').read_text())
          open_ids = [s['slot_id'] for s in data['slots'] if s['status'] == 'OPEN']
          assert open_ids == ['columns-gate-d-post-237-gap-audit-v3', 'columns-fields-bulk-edit-v1'], open_ids
          assert next(s for s in data['slots'] if s['slot_id'] == 'columns-fields-inline-edit-ui-v1')['status'] == 'DONE'
          PY
          rm .github/workflows/reconcile-gate-d-after-237.yml
          git add -A
          git diff --cached --check
          git commit -m "Supervisor: open post-#237 Gate D lanes"
          git push origin HEAD:supervisor/gate-d-after-237
