name: Security Node Lockfile Bootstrap TEMP

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'package.json'
      - '.github/workflows/security-node-lockfile-bootstrap-temp.yml'

permissions:
  actions: read
  contents: write

jobs:
  refresh-lockfile:
    if: >-
      github.event.pull_request.number == 1111 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/node-dev-dependency-remediation-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Restore accepted zero-vulnerability lockfile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/security-lockfile-accepted /tmp/security-lockfile-accepted.zip
          mkdir -p /tmp/security-lockfile-accepted
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10616492438/zip" > /tmp/security-lockfile-accepted.zip
          test "$(sha256sum /tmp/security-lockfile-accepted.zip | awk '{print $1}')" = "38e1ae861354e9614a14277aa2858dc798830681e552f2674325a50de65eefda"
          unzip -q /tmp/security-lockfile-accepted.zip -d /tmp/security-lockfile-accepted
          cmp --silent package.json /tmp/security-lockfile-accepted/package.json
          cp /tmp/security-lockfile-accepted/package-lock.json package-lock.json
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm run lint:js

      - name: Commit only regenerated lockfile and retire bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/security-node-lockfile-bootstrap-temp.yml
          git add package-lock.json
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fx 'package-lock.json'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/security-node-lockfile-bootstrap-temp.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: regenerate accepted zero-vulnerability lockfile'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
