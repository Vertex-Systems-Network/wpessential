name: Fix Bulk Unverified V1

on:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/columns-fields-bulk-edit-v1
          fetch-depth: 0
      - name: Apply exact semantic contract patch
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('admin-ui/src/columns-runtime.ts')
          text = runtime.read_text()
          replacements = {
              'const failedPostIds: number[] = [];': 'const unverifiedPostIds: number[] = [];',
              'failedPostIds.push( postId );': 'unverifiedPostIds.push( postId );',
              'const failureDetail =\n\t\t\t\t\tfailedPostIds.length > 0\n\t\t\t\t\t\t? ` Failed post IDs: ${ failedPostIds.join( \', \' ) }.`\n\t\t\t\t\t\t: \"\";': 'const unverifiedDetail =\n\t\t\t\t\tunverifiedPostIds.length > 0\n\t\t\t\t\t\t? ` Unverified post IDs: ${ unverifiedPostIds.join( \', \' ) }.`\n\t\t\t\t\t\t: \"\";',
              '${ failedPostIds.length } failed': '${ unverifiedPostIds.length } unverified',
              '+\n\t\t\t\t\tfailureDetail +': '+\n\t\t\t\t\tunverifiedDetail +',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing runtime needle: {old!r}')
              text = text.replace(old, new, 1)
          runtime.write_text(text)

          test = Path('tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php')
          text = test.read_text()
          replacements = {
              'testAttemptedBulkMutationReportsPartialFailuresAndInvalidatesPreview': 'testAttemptedBulkMutationReportsUnverifiedOutcomesAndInvalidatesPreview',
              "self::assertStringContainsString('const failedPostIds: number[] = [];', $source);": "self::assertStringContainsString('const unverifiedPostIds: number[] = [];', $source);",
              "self::assertStringContainsString('failedPostIds.push( postId );', $source);": "self::assertStringContainsString('unverifiedPostIds.push( postId );', $source);",
              "self::assertStringContainsString('Bulk Fields edit finished:', $source);": "self::assertStringContainsString('Bulk Fields edit finished:', $source);\n        self::assertStringContainsString('unverified', $source);\n        self::assertStringContainsString('Unverified post IDs:', $source);\n        self::assertStringNotContainsString(' Failed post IDs:', $source);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing test needle: {old!r}')
              text = text.replace(old, new, 1)
          test.write_text(text)

          Path('.github/workflows/fix-bulk-unverified-v1.yml').unlink()
      - name: Commit clean patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-ui/src/columns-runtime.ts tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php .github/workflows/fix-bulk-unverified-v1.yml
          git diff --cached --check
          git commit -m "fix(admin-columns): distinguish unverified bulk outcomes"
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
