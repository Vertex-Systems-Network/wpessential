name: Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'frameworks/**/*.php'
      - 'tests/Smoke/security-ci-permissions-contract.php'
      - 'tests/Integration/wordpress-ajax-nonce-policy.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: dependency and CI security contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Composer dependency advisory audit
        run: composer audit --locked --no-interaction

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked Node graph without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: NPM dependency advisory audit
        run: npm audit --audit-level=high

      - name: Validate security regression contract
        run: |
          php -l tests/Smoke/security-ci-permissions-contract.php
          php tests/Smoke/security-ci-permissions-contract.php

      - name: Verify tracked source remains clean
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
