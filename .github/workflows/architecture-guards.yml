name: Architecture Guards

on:
  pull_request:
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'tests/Integration/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  push:
    branches:
      - 'implementation/**'
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'tests/Integration/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Validate architecture manifests
        run: php tools/architecture/validate.php

      - name: Validate engineering contracts
        run: php tools/architecture/validate-engineering-contracts.php

      - name: PHP syntax
        run: find frameworks tests/Smoke tests/Integration -name '*.php' -print0 | xargs -0 -n1 php -l && php -l wpessential.php

      - name: Run diagnostic smoke suite
        id: smoke
        shell: bash
        run: |
          set +e
          : > smoke-results.log
          overall=0
          for script in \
            tests/Smoke/kernel-smoke.php \
            tests/Smoke/platform-core-smoke.php \
            tests/Smoke/audit-jobs-smoke.php \
            tests/Smoke/action-scheduler-probe-smoke.php \
            tests/Smoke/vault-assets-integrations-smoke.php \
            tests/Smoke/persistence-migrations-smoke.php \
            tests/Smoke/wordpress-abilities-bridge-smoke.php \
            tests/Smoke/engineering-contracts-smoke.php \
            tests/Smoke/compiled-registration-persistence-smoke.php
          do
            echo "===== ${script} =====" | tee -a smoke-results.log
            php "${script}" >> smoke-results.log 2>&1
            code=$?
            echo "exit=${code}" | tee -a smoke-results.log
            if [ "${code}" -ne 0 ]; then
              overall=1
            fi
          done
          cat smoke-results.log
          echo "exit_code=${overall}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}
          path: smoke-results.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce smoke gate
        if: steps.smoke.outputs.exit_code != '0'
        run: exit 1

      - name: MySQL compiled-registration integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/compiled-registration-mysql.php

      - name: MySQL Definition/Audit persistence integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/platform-persistence-mysql.php
