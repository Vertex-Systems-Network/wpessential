name: Architecture Guards

on:
  pull_request:
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'tests/Integration/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  push:
    branches:
      - 'implementation/**'
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'tests/Integration/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli
          coverage: none

      - name: Prepare pinned WordPress 7.1 core fixture
        shell: bash
        run: |
          rm -rf /tmp/wordpress /tmp/wordpress-7.1.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            https://wordpress.org/wordpress-7.1.tar.gz \
            --output /tmp/wordpress-7.1.tar.gz
          tar -xzf /tmp/wordpress-7.1.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-load.php

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Validate architecture manifests
        run: php tools/architecture/validate.php

      - name: Validate engineering contracts
        run: php tools/architecture/validate-engineering-contracts.php

      - name: PHP syntax
        run: find frameworks tests/Smoke tests/Integration -name '*.php' -print0 | xargs -0 -n1 php -l && php -l wpessential.php

      - name: Run diagnostic smoke suite
        id: smoke
        shell: bash
        run: |
          set +e
          : > smoke-results.log
          overall=0
          for script in \
            tests/Smoke/kernel-smoke.php \
            tests/Smoke/platform-core-smoke.php \
            tests/Smoke/audit-jobs-smoke.php \
            tests/Smoke/action-scheduler-probe-smoke.php \
            tests/Smoke/vault-assets-integrations-smoke.php \
            tests/Smoke/persistence-migrations-smoke.php \
            tests/Smoke/wordpress-abilities-bridge-smoke.php \
            tests/Smoke/engineering-contracts-smoke.php \
            tests/Smoke/compiled-registration-persistence-smoke.php
          do
            echo "===== ${script} =====" | tee -a smoke-results.log
            php "${script}" >> smoke-results.log 2>&1
            code=$?
            echo "exit=${code}" | tee -a smoke-results.log
            if [ "${code}" -ne 0 ]; then
              overall=1
            fi
          done
          cat smoke-results.log
          echo "exit_code=${overall}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}
          path: smoke-results.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce smoke gate
        if: steps.smoke.outputs.exit_code != '0'
        run: exit 1

      - name: MySQL compiled-registration integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/compiled-registration-mysql.php

      - name: MySQL Definition/Audit persistence integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/platform-persistence-mysql.php

      - name: Real WordPress AJAX nonce Policy integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-ajax-nonce-policy.php

      - name: Prepare pinned Action Scheduler coexistence fixtures
        shell: bash
        run: |
          rm -rf /tmp/as-4.1.0 /tmp/as-3.9.3 /tmp/as-4.1.0.zip /tmp/as-3.9.3.zip
          mkdir -p /tmp/as-4.1.0 /tmp/as-3.9.3 /tmp/wordpress/wp-content/plugins
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/woocommerce/action-scheduler/releases/download/4.1.0/action-scheduler.zip \
            --output /tmp/as-4.1.0.zip
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/woocommerce/action-scheduler/releases/download/3.9.3/action-scheduler.zip \
            --output /tmp/as-3.9.3.zip
          unzip -q /tmp/as-4.1.0.zip -d /tmp/as-4.1.0
          unzip -q /tmp/as-3.9.3.zip -d /tmp/as-3.9.3
          src410="$(dirname "$(find /tmp/as-4.1.0 -name action-scheduler.php -print -quit)")"
          src393="$(dirname "$(find /tmp/as-3.9.3 -name action-scheduler.php -print -quit)")"
          test -f "${src410}/action-scheduler.php"
          test -f "${src393}/action-scheduler.php"
          rm -rf /tmp/wordpress/wp-content/plugins/action-scheduler-4.1.0 /tmp/wordpress/wp-content/plugins/action-scheduler-3.9.3
          cp -R "${src410}" /tmp/wordpress/wp-content/plugins/action-scheduler-4.1.0
          cp -R "${src393}" /tmp/wordpress/wp-content/plugins/action-scheduler-3.9.3

      - name: Activate Action Scheduler fixture and set coexistence order
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-action-scheduler-setup.php

      - name: Real Action Scheduler coexistence backend integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-action-scheduler-coexistence.php

      - name: Real WordPress durable JobService persistence lease integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-job-persistence.php
