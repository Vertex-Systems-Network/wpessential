name: Architecture Guards

on:
  pull_request:
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  push:
    branches:
      - 'implementation/**'
    paths:
      - 'config/architecture/**'
      - 'tools/architecture/**'
      - 'frameworks/**'
      - 'tests/Smoke/**'
      - 'wpessential.php'
      - 'composer.json'
      - '.github/workflows/architecture-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Validate architecture manifests
        run: php tools/architecture/validate.php

      - name: Validate engineering contracts
        run: php tools/architecture/validate-engineering-contracts.php

      - name: PHP syntax
        run: find frameworks tests/Smoke -name '*.php' -print0 | xargs -0 -n1 php -l && php -l wpessential.php

      - name: Kernel smoke
        run: php tests/Smoke/kernel-smoke.php

      - name: Platform core smoke
        run: php tests/Smoke/platform-core-smoke.php

      - name: Audit and jobs smoke
        run: php tests/Smoke/audit-jobs-smoke.php

      - name: Action Scheduler capability probe smoke
        run: php tests/Smoke/action-scheduler-probe-smoke.php

      - name: Vault, assets and integrations smoke
        run: php tests/Smoke/vault-assets-integrations-smoke.php

      - name: Persistence and migrations smoke
        run: php tests/Smoke/persistence-migrations-smoke.php

      - name: WordPress abilities bridge smoke
        run: php tests/Smoke/wordpress-abilities-bridge-smoke.php

      - name: Engineering contracts smoke
        run: php tests/Smoke/engineering-contracts-smoke.php
