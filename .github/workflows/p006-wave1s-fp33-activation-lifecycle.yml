name: P-006 Wave 1S FP-33 Activation Lifecycle

on:
  pull_request:
    paths:
      - '.github/workflows/p006-wave1s-fp33-activation-lifecycle.yml'
      - 'tools/p006/p006-wave1s-fp33-activation-lifecycle.php'
      - 'tools/p006/p006-wave1l-build-breaking-artifacts.php'
      - 'tools/p006/p006-wave1l-wordpress-setup.sh'
      - 'tools/p006/p006-wave1l-swap-plugin.sh'
      - 'tools/release/build-distributable.php'
      - 'tools/release/build-free-pro-distributables.php'
      - 'frameworks/Modules/Compatibility/**'
      - 'frameworks/Bootstrap/Plugin.php'
      - 'frameworks/Platform/Database/Migrations/**'
      - 'frameworks/Modules/CustomTables/Migration/**'
      - 'wpessential.php'
      - 'wpessential-pro.php'
      - 'package.json'
      - 'package-lock.json'
      - 'admin-ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p006-wave1s-fp33-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-gate:
    name: Wave 1S latest-change gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_runtime: ${{ steps.gate.outputs.run_runtime }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether latest change requires runtime
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_runtime=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$BEFORE_SHA" ]; then
            git cat-file -e "$BEFORE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed"
            runtime_regex='^(\.github/workflows/p006-wave1s-fp33-activation-lifecycle\.yml|tools/p006/p006-wave1s-fp33-activation-lifecycle\.php|tools/p006/p006-wave1l-build-breaking-artifacts\.php|tools/p006/p006-wave1l-wordpress-setup\.sh|tools/p006/p006-wave1l-swap-plugin\.sh|tools/release/build-distributable\.php|tools/release/build-free-pro-distributables\.php|frameworks/Modules/Compatibility/|frameworks/Bootstrap/Plugin\.php|frameworks/Platform/Database/Migrations/|frameworks/Modules/CustomTables/Migration/|wpessential\.php|wpessential-pro\.php|package\.json|package-lock\.json|admin-ui/)'
            if printf '%s\n' "$changed" | grep -Eq "$runtime_regex"; then run_runtime=true; else run_runtime=false; fi
          fi
          echo "run_runtime=$run_runtime" >> "$GITHUB_OUTPUT"
          echo "Wave 1S heavy runtime required: $run_runtime"

  build-candidates:
    name: Build and statically verify Wave 1S breaking graph
    needs: change-gate
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source head
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Build admin assets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint:package
          npm run build:admin
      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2
      - name: Validate Wave 1S tooling
        run: |
          set -euo pipefail
          composer validate --strict
          php -l tools/release/build-distributable.php
          php -l tools/p006/p006-wave1l-build-breaking-artifacts.php
          php -l tools/p006/p006-wave1s-fp33-activation-lifecycle.php
          bash -n tools/p006/p006-wave1l-wordpress-setup.sh
          bash -n tools/p006/p006-wave1l-swap-plugin.sh
      - name: Build canonical package pair twice
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          cp artifacts/wpessential.zip /tmp/w1s-free.zip
          cp artifacts/wpessential-pro.zip /tmp/w1s-pro.zip
          php tools/release/build-distributable.php
          cmp --silent /tmp/w1s-free.zip artifacts/wpessential.zip
          cmp --silent /tmp/w1s-pro.zip artifacts/wpessential-pro.zip
      - name: Derive breaking graph twice
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_CANONICAL_FREE_ZIP: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_CANONICAL_PRO_ZIP: ${{ github.workspace }}/artifacts/wpessential-pro.zip
        run: |
          set -euo pipefail
          rm -rf artifacts/p006-wave1s
          mkdir -p artifacts/p006-wave1s/set-a artifacts/p006-wave1s/set-b
          WPE_P006_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/p006-wave1s/set-a" php tools/p006/p006-wave1l-build-breaking-artifacts.php
          WPE_P006_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/p006-wave1s/set-b" php tools/p006/p006-wave1l-build-breaking-artifacts.php
          for file in f1.zip f2.zip p0.zip p2.zip candidate-identity.json; do
            cmp --silent "artifacts/p006-wave1s/set-a/$file" "artifacts/p006-wave1s/set-b/$file"
          done
          mv artifacts/p006-wave1s/set-a artifacts/p006-wave1s/candidates
          rm -rf artifacts/p006-wave1s/set-b
      - name: Normalize TEMP-017 authority
        run: |
          set -euo pipefail
          jq '{
            protocol:"P-006",wave:"1S-fp33-activation-lifecycle",source_sha:.source_sha,
            temporary_approval_id:"GOV-P001-CF-TEMP-017",authorization:"GOV-P001-CF-TEMP-017",
            authorized_fixtures:["FP-33"],classification:"FORMAL FP-33 RE-EXECUTION / NON-CERTIFYING",
            historical_graph_reuse:{source_wave:.wave,historical_authority_reused:false},
            nodes:{F1:.nodes.F1,F2:.nodes.F2,P0:.nodes.P0,P2:.nodes.P2},
            pairs:{F1_P0:.pairs.F1_P0,F2_P0:.pairs.F2_P0,F1_P2:.pairs.F1_P2},
            accounting:{documented:144,executed:52,pass:51,fail:0,inconclusive:1,already_counted_fixture:"FP-33"},
            boundaries:{destructive_migration_execution:false,product_runtime_source_modified:false,
              provider_or_remote_entitlement_used:false,updater_or_tuf_certified:false,
              pair_certified:false,runtime_certified:false,migration_certified:false,adr_0010:"Proposed"}
          }' artifacts/p006-wave1s/candidates/candidate-identity.json > artifacts/p006-wave1s/candidates/wave1s-identity.json
          test "$(jq -r '.temporary_approval_id' artifacts/p006-wave1s/candidates/wave1s-identity.json)" = "GOV-P001-CF-TEMP-017"
          test "$(jq -r '.pairs.F2_P0.expected_state' artifacts/p006-wave1s/candidates/wave1s-identity.json)" = "free_version_too_new"
          test "$(jq -r '.pairs.F1_P2.expected_state' artifacts/p006-wave1s/candidates/wave1s-identity.json)" = "free_version_too_old"
      - name: Static first-party lifecycle-hook prerequisite
        env:
          WPE_P006_EXECUTION_MODE: static
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1s/candidates
          WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/wave1s-identity.json
          WPE_P006_STATIC_SCAN_OUTPUT: ${{ github.workspace }}/artifacts/p006-wave1s/static-scan.json
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
          test "$(jq -r '.status' artifacts/p006-wave1s/static-scan.json)" = "PASS"
      - name: Upload immutable Wave 1S candidate graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1s-candidates-${{ github.run_id }}
          path: |
            artifacts/p006-wave1s/candidates/
            artifacts/p006-wave1s/static-scan.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  lifecycle:
    name: FP-33 lifecycle / ${{ matrix.cell }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: [change-gate, build-candidates]
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: minimum, wordpress: '6.9', php: '8.2'}
          - {cell: reference, wordpress: '7.1', php: '8.5'}
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_DATABASE: wpessential_test, MYSQL_ROOT_PASSWORD: root}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1s/candidates
      WPE_P006_F1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/f1.zip
      WPE_P006_F2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/f2.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/p0.zip
      WPE_P006_P2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/p2.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1s/candidates/wave1s-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1s/evidence/${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1s-${{ matrix.cell }}-network.log
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none
      - name: Download exact Wave 1S graph
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1s-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1s
      - name: Validate runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WPE_P006_SOURCE_SHA"
          for file in f1.zip f2.zip p0.zip p2.zip wave1s-identity.json; do test -s "artifacts/p006-wave1s/candidates/$file"; done
          test "$(jq -r '.status' artifacts/p006-wave1s/static-scan.json)" = "PASS"
          php -l tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: Prepare disposable WordPress
        run: bash tools/p006/p006-wave1l-wordpress-setup.sh
      - name: Activate Free only
        env: {WPE_P006_EXECUTION_MODE: prepare}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: Establish baseline Free migration state
        env: {WPE_P006_EXECUTION_MODE: baseline}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: Switch Free to F2
        env: {WPE_P006_SWAP_PLUGIN: free, WPE_P006_SWAP_TARGET: f2}
        run: bash tools/p006/p006-wave1l-swap-plugin.sh
      - name: A activation 1
        env: {WPE_P006_EXECUTION_MODE: activate, WPE_P006_EXPECTED_FREE_NODE: F2, WPE_P006_EXPECTED_PRO_NODE: P0, WPE_P006_PHASE: f2-p0-activation-1, WPE_P006_EVIDENCE_FILE: a-activate-1.json}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: A observe 1 and deactivate
        env: {WPE_P006_EXECUTION_MODE: observe, WPE_P006_EXPECTED_FREE_NODE: F2, WPE_P006_EXPECTED_PRO_NODE: P0, WPE_P006_EXPECTED_STATE: free_version_too_new, WPE_P006_PHASE: f2-p0-observe-1, WPE_P006_EVIDENCE_FILE: a-observe-1.json, WPE_P006_DEACTIVATE_AFTER: '1'}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: A activation 2
        env: {WPE_P006_EXECUTION_MODE: activate, WPE_P006_EXPECTED_FREE_NODE: F2, WPE_P006_EXPECTED_PRO_NODE: P0, WPE_P006_PHASE: f2-p0-activation-2, WPE_P006_EVIDENCE_FILE: a-activate-2.json}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: A observe 2 and deactivate
        env: {WPE_P006_EXECUTION_MODE: observe, WPE_P006_EXPECTED_FREE_NODE: F2, WPE_P006_EXPECTED_PRO_NODE: P0, WPE_P006_EXPECTED_STATE: free_version_too_new, WPE_P006_PHASE: f2-p0-observe-2, WPE_P006_EVIDENCE_FILE: a-observe-2.json, WPE_P006_DEACTIVATE_AFTER: '1'}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: Switch Free to F1
        env: {WPE_P006_SWAP_PLUGIN: free, WPE_P006_SWAP_TARGET: f1}
        run: bash tools/p006/p006-wave1l-swap-plugin.sh
      - name: Switch Pro to P2
        env: {WPE_P006_SWAP_PLUGIN: pro, WPE_P006_SWAP_TARGET: p2}
        run: bash tools/p006/p006-wave1l-swap-plugin.sh
      - name: B activation 1
        env: {WPE_P006_EXECUTION_MODE: activate, WPE_P006_EXPECTED_FREE_NODE: F1, WPE_P006_EXPECTED_PRO_NODE: P2, WPE_P006_PHASE: f1-p2-activation-1, WPE_P006_EVIDENCE_FILE: b-activate-1.json}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: B observe 1 and deactivate
        env: {WPE_P006_EXECUTION_MODE: observe, WPE_P006_EXPECTED_FREE_NODE: F1, WPE_P006_EXPECTED_PRO_NODE: P2, WPE_P006_EXPECTED_STATE: free_version_too_old, WPE_P006_PHASE: f1-p2-observe-1, WPE_P006_EVIDENCE_FILE: b-observe-1.json, WPE_P006_DEACTIVATE_AFTER: '1'}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: B activation 2
        env: {WPE_P006_EXECUTION_MODE: activate, WPE_P006_EXPECTED_FREE_NODE: F1, WPE_P006_EXPECTED_PRO_NODE: P2, WPE_P006_PHASE: f1-p2-activation-2, WPE_P006_EVIDENCE_FILE: b-activate-2.json}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: B observe 2 and deactivate
        env: {WPE_P006_EXECUTION_MODE: observe, WPE_P006_EXPECTED_FREE_NODE: F1, WPE_P006_EXPECTED_PRO_NODE: P2, WPE_P006_EXPECTED_STATE: free_version_too_old, WPE_P006_PHASE: f1-p2-observe-2, WPE_P006_EVIDENCE_FILE: b-observe-2.json, WPE_P006_DEACTIVATE_AFTER: '1'}
        run: php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
      - name: Aggregate FP-33 cell
        env: {WPE_P006_EXECUTION_MODE: aggregate}
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1s-fp33-activation-lifecycle.php
          test -s "$WPE_P006_EVIDENCE_DIR/summary.json"
          cat "$WPE_P006_EVIDENCE_DIR/summary.json"
      - name: Upload immutable runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1s-${{ matrix.cell }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1s/candidates/wave1s-identity.json
            artifacts/p006-wave1s/static-scan.json
            artifacts/p006-wave1s/evidence/${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  terminal:
    name: Wave 1S terminal aggregate
    needs: [change-gate, build-candidates, lifecycle]
    if: always() && needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build-candidates.result }}
      RUNTIME_RESULT: ${{ needs.lifecycle.result }}
    steps:
      - name: Record terminal result
        run: |
          set -euo pipefail
          status=FAIL
          if [ "$BUILD_RESULT" = "success" ] && [ "$RUNTIME_RESULT" = "success" ]; then status=PASS; fi
          mkdir -p artifacts/p006-wave1s/terminal
          jq -n --arg status "$status" --arg build "$BUILD_RESULT" --arg runtime "$RUNTIME_RESULT" '{
            status:$status,protocol:"P-006",wave:"1S",fixture:"FP-33",
            authorization:"GOV-P001-CF-TEMP-017",classification:"FORMAL FP-33 RE-EXECUTION / NON-CERTIFYING",
            build_static_result:$build,runtime_matrix_result:$runtime,
            accounting_if_pass:{documented:144,executed:52,pass:52,fail:0,inconclusive:0},
            executed_count_increment:0,destructive_migration_executed:false,
            pair_certified:false,runtime_certified:false,migration_certified:false,
            updater_or_tuf_certified:false,adr_0010:"Proposed",ga_or_release_authorized:false
          }' > artifacts/p006-wave1s/terminal/terminal.json
          cat artifacts/p006-wave1s/terminal/terminal.json
      - name: Upload terminal marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1s-terminal-${{ github.run_id }}
          path: artifacts/p006-wave1s/terminal/terminal.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce terminal success
        run: |
          test "$BUILD_RESULT" = "success"
          test "$RUNTIME_RESULT" = "success"
