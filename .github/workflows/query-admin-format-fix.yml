name: Query Admin Format Fix

on:
  push:
    branches:
      - 'agent/query-admin-ux-scaffold-v1'
    paths:
      - 'admin-ui/src/query.ts'
      - '.github/workflows/query-admin-format-fix.yml'

permissions:
  contents: write

concurrency:
  group: query-admin-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
        with:
          ref: agent/query-admin-ux-scaffold-v1
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked admin graph
        run: npm ci --ignore-scripts

      - name: Format Query scaffold with repository Prettier
        run: ./node_modules/.bin/prettier --write admin-ui/src/query.ts

      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin-ui/src/query.ts; then
            echo 'Query scaffold already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-ui/src/query.ts
          git commit -m 'style(query): apply canonical admin formatting'
          git push origin HEAD:agent/query-admin-ux-scaffold-v1
