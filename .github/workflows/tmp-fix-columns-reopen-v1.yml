name: Temporary Admin Columns reopen strict type fix

on:
  push:
    branches:
      - agent/admin-columns-reopen-saved-view-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/admin-columns-reopen-saved-view-v1
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Patch strict narrowing and optional session types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-ui/src/columns-runtime.ts')
          s = p.read_text()
          old = """\tassignment?: JsonObject;\n\tlayout?: JsonObject;\n\tvisibility?: JsonObject;\n\tcolumnIdentities: Map< number, ColumnIdentity >;\n"""
          new = """\tassignment: JsonObject | undefined;\n\tlayout: JsonObject | undefined;\n\tvisibility: JsonObject | undefined;\n\tcolumnIdentities: Map< number, ColumnIdentity >;\n"""
          if s.count(old) != 1:
              raise SystemExit(f'EditorSession optional block occurrences: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = """\tconst target = bootstrap.targets.find(\n\t\t( candidate ) =>\n\t\t\tcandidate.type === payload.target.type &&\n\t\t\tcandidate.key === payload.target.key\n\t);\n"""
          new = """\tconst payloadTarget = payload.target;\n\tconst target = bootstrap.targets.find(\n\t\t( candidate ) =>\n\t\t\tcandidate.type === payloadTarget.type &&\n\t\t\tcandidate.key === payloadTarget.key\n\t);\n"""
          if s.count(old) != 1:
              raise SystemExit(f'target callback block occurrences: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = """\t\tconst source = bootstrap.sources.find(\n\t\t\t( available ) =>\n\t\t\t\tavailable.owner === candidate.source.owner &&\n\t\t\t\tavailable.reference === candidate.source.reference\n\t\t);\n"""
          new = """\t\tconst candidateSource = candidate.source;\n\t\tconst source = bootstrap.sources.find(\n\t\t\t( available ) =>\n\t\t\t\tavailable.owner === candidateSource.owner &&\n\t\t\t\tavailable.reference === candidateSource.reference\n\t\t);\n"""
          if s.count(old) != 1:
              raise SystemExit(f'source callback block occurrences: {s.count(old)}')
          s = s.replace(old, new, 1)
          s = s.replace('owner: candidate.source.owner,\n\t\t\t\treference: candidate.source.reference,', 'owner: candidateSource.owner,\n\t\t\t\treference: candidateSource.reference,', 1)

          old = """\t\t\tviewEnabled: true,\n\t\t\tcolumnIdentities: new Map(),\n"""
          new = """\t\t\tviewEnabled: true,\n\t\t\tassignment: undefined,\n\t\t\tlayout: undefined,\n\t\t\tvisibility: undefined,\n\t\t\tcolumnIdentities: new Map(),\n"""
          if s.count(old) != 1:
              raise SystemExit(f'session init block occurrences: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npm ci --ignore-scripts
          npm run lint:js -- --fix
          npm run typecheck
      - name: Commit normalized runtime and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-columns-reopen-v1.yml
          git add admin-ui/src/columns-runtime.ts
          git diff --cached --check
          git commit -m "fix(columns): satisfy strict reopen runtime typing"
          git push origin HEAD:agent/admin-columns-reopen-saved-view-v1
