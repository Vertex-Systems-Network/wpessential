name: P-006 Wave 1G Mismatch-Context Runtime Evidence

on:
  pull_request:
    paths:
      - 'frameworks/**'
      - 'admin-ui/**'
      - 'wpessential.php'
      - 'wpessential-pro.php'
      - 'readme.txt'
      - 'LICENSE'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/release/**'
      - '.github/workflows/p006-wave1g-mismatch-context-runtime-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidates:
    name: Build immutable candidates and reproduce authorized TEST-ONLY Wave 1G variants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Validate and build production admin assets
        run: |
          npm run lint:package
          npm run build:admin

      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate metadata and Wave 1G harness syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l wpessential.php
          php -l wpessential-pro.php
          php -l tools/release/build-distributable.php
          php -l tools/release/build-free-pro-distributables.php
          php -l tools/release/p006-wave1g-mismatch-context-runtime-evidence.php
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build first immutable candidates
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          for artifact in artifacts/wpessential.zip artifacts/wpessential-package.json artifacts/wpessential-pro.zip artifacts/wpessential-pro-package.json; do
            test -s "${artifact}"
          done
          cp artifacts/wpessential.zip /tmp/p006-wave1g-free-first.zip
          cp artifacts/wpessential-pro.zip /tmp/p006-wave1g-pro-first.zip
          sha256sum artifacts/wpessential.zip | tee /tmp/p006-wave1g-free-first.sha256
          sha256sum artifacts/wpessential-pro.zip | tee /tmp/p006-wave1g-pro-first.sha256

      - name: Rebuild, prove determinism, and verify original immutable identity
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          free_first="$(cut -d' ' -f1 /tmp/p006-wave1g-free-first.sha256)"
          pro_first="$(cut -d' ' -f1 /tmp/p006-wave1g-pro-first.sha256)"
          free_second="$(sha256sum artifacts/wpessential.zip | cut -d' ' -f1)"
          pro_second="$(sha256sum artifacts/wpessential-pro.zip | cut -d' ' -f1)"
          test "${free_first}" = "${free_second}"
          test "${pro_first}" = "${pro_second}"
          cmp --silent /tmp/p006-wave1g-free-first.zip artifacts/wpessential.zip
          cmp --silent /tmp/p006-wave1g-pro-first.zip artifacts/wpessential-pro.zip
          test "${free_second}" = "2acf6d202315e7105b89589822a95448febdc06634c0399dfcfc57b702e14d80"
          test "${pro_second}" = "771bf516e9c1d0707a7d036309b14520facf5daa59742b337b0a0fdf622c0363"
          pair_id="$(php -r 'echo hash("sha256", "free:" . $argv[1] . "\npro:" . $argv[2] . "\n");' "${free_second}" "${pro_second}")"
          test "${pair_id}" = "39a31275225f1b560a22096fcbd66aef8878bc23554c5b32c6861a6a446215ea"

      - name: Reproduce exact authorized NON-RELEASE TEST-ONLY mismatch candidates
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_ORIGINAL_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
          WPE_P006_VARIANT_DIR: ${{ github.workspace }}/artifacts/p006-wave1g-candidates
        run: |
          set -euo pipefail
          # Reuse the already-merged deterministic Wave 1F byte-derivation utility only.
          # Wave 1G authority is independently recorded and verified by the Wave 1G identity file below.
          php tools/release/p006-wave1f-marketing-version-mismatch-evidence.php derive
          test -s artifacts/p006-wave1g-candidates/wpessential-fp19-0.0.9.zip
          test -s artifacts/p006-wave1g-candidates/wpessential-fp20-0.1.1.zip
          test "$(sha256sum artifacts/p006-wave1g-candidates/wpessential-fp19-0.0.9.zip | cut -d' ' -f1)" = "c67c6b67be87b2ca21f3f6bfdb97430b0580846444a2441665f414885ca224b6"
          test "$(sha256sum artifacts/p006-wave1g-candidates/wpessential-fp20-0.1.1.zip | cut -d' ' -f1)" = "819c6674cecd42b4f9ba2e7226c5913c616f31d49187568af07383a0a0bc6471"
          rm -f artifacts/p006-wave1g-candidates/p006-wave1f-candidate-identity.json
          php tools/release/p006-wave1g-mismatch-context-runtime-evidence.php identity
          test -s artifacts/p006-wave1g-candidates/p006-wave1g-candidate-identity.json
          cat artifacts/p006-wave1g-candidates/p006-wave1g-candidate-identity.json

      - name: Upload immutable candidates and exact TEST-ONLY variants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1g-candidates-${{ github.run_id }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential-package.json
            artifacts/wpessential-pro.zip
            artifacts/wpessential-pro-package.json
            artifacts/p006-wave1g-candidates/
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  runtime-evidence:
    name: ${{ matrix.variant }} mismatch / ${{ matrix.cell }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: build-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: old
            cell: minimum
            wordpress: '6.9'
            php: '8.2'
            variant_file: wpessential-fp19-0.0.9.zip
            expected_free_sha256: c67c6b67be87b2ca21f3f6bfdb97430b0580846444a2441665f414885ca224b6
            expected_pair_id: b9ea99b645dd9abcadbf6110cbeed85ba2ea73cf79940596cd7aa5bb5204eece
          - variant: old
            cell: reference
            wordpress: '7.1'
            php: '8.5'
            variant_file: wpessential-fp19-0.0.9.zip
            expected_free_sha256: c67c6b67be87b2ca21f3f6bfdb97430b0580846444a2441665f414885ca224b6
            expected_pair_id: b9ea99b645dd9abcadbf6110cbeed85ba2ea73cf79940596cd7aa5bb5204eece
          - variant: new
            cell: minimum
            wordpress: '6.9'
            php: '8.2'
            variant_file: wpessential-fp20-0.1.1.zip
            expected_free_sha256: 819c6674cecd42b4f9ba2e7226c5913c616f31d49187568af07383a0a0bc6471
            expected_pair_id: 890f74a7f8bc560be3311fb9dab438e47e658350a227674eac4dffb3d7155e5d
          - variant: new
            cell: reference
            wordpress: '7.1'
            php: '8.5'
            variant_file: wpessential-fp20-0.1.1.zip
            expected_free_sha256: 819c6674cecd42b4f9ba2e7226c5913c616f31d49187568af07383a0a0bc6471
            expected_pair_id: 890f74a7f8bc560be3311fb9dab438e47e658350a227674eac4dffb3d7155e5d
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_VARIANT_ID: ${{ matrix.variant }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_ORIGINAL_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
      WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1g-candidates/${{ matrix.variant_file }}
      WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1g/${{ matrix.variant }}-${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1g-${{ matrix.variant }}-${{ matrix.cell }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none

      - name: Download exact candidate set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1g-candidates-${{ github.run_id }}
          path: artifacts

      - name: Verify original and authorized candidate identities
        shell: bash
        env:
          WPE_EXPECTED_FREE_SHA256: ${{ matrix.expected_free_sha256 }}
          WPE_EXPECTED_PAIR_ID: ${{ matrix.expected_pair_id }}
        run: |
          set -euo pipefail
          for artifact in artifacts/wpessential.zip artifacts/wpessential-pro.zip artifacts/p006-wave1g-candidates/p006-wave1g-candidate-identity.json "${WPE_P006_FREE_ZIP_PATH}"; do test -s "${artifact}"; done
          php -r '
            $identity = json_decode(file_get_contents("artifacts/p006-wave1g-candidates/p006-wave1g-candidate-identity.json"), true, flags: JSON_THROW_ON_ERROR);
            $variantId = getenv("WPE_P006_VARIANT_ID");
            if (($identity["source_sha"] ?? null) !== getenv("WPE_P006_SOURCE_SHA")) { fwrite(STDERR, "Candidate source SHA mismatch\n"); exit(1); }
            if (($identity["temporary_approval_id"] ?? null) !== "GOV-OWNER-CONSENT-P001-TEMP-P006-005") { fwrite(STDERR, "Temporary approval mismatch\n"); exit(1); }
            if (($identity["classification"] ?? null) !== "NON-RELEASE / TEST-ONLY") { fwrite(STDERR, "Candidate classification mismatch\n"); exit(1); }
            $variant = $identity["variants"][$variantId] ?? null;
            if (!is_array($variant)) { fwrite(STDERR, "Missing variant identity\n"); exit(1); }
            $free = hash_file("sha256", getenv("WPE_P006_FREE_ZIP_PATH"));
            $pro = hash_file("sha256", "artifacts/wpessential-pro.zip");
            $pair = hash("sha256", "free:" . $free . "\npro:" . $pro . "\n");
            if ($free !== getenv("WPE_EXPECTED_FREE_SHA256") || $pair !== getenv("WPE_EXPECTED_PAIR_ID")) { fwrite(STDERR, "Authorized Wave 1F candidate hash/pair mismatch; STOP\n"); exit(1); }
            if (($variant["sha256"] ?? null) !== $free || ($variant["pair_id_sha256"] ?? null) !== $pair) { fwrite(STDERR, "Identity JSON mismatch\n"); exit(1); }
            if (($identity["original"]["free_sha256"] ?? null) !== "2acf6d202315e7105b89589822a95448febdc06634c0399dfcfc57b702e14d80" || ($identity["original"]["pro_sha256"] ?? null) !== "771bf516e9c1d0707a7d036309b14520facf5daa59742b337b0a0fdf622c0363") { fwrite(STDERR, "Original immutable identity drift\n"); exit(1); }
          '

      - name: Prepare disposable WordPress core and exact mismatch pair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress /tmp/wordpress.tar.gz
          curl --fail --silent --show-error --location --retry 3 "https://wordpress.org/wordpress-${WPE_P006_EXPECTED_WP}.tar.gz" --output /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-load.php
          mkdir -p /tmp/wordpress/wp-content/plugins /tmp/wordpress/wp-content/mu-plugins
          unzip -q "${WPE_P006_FREE_ZIP_PATH}" -d /tmp/wordpress/wp-content/plugins
          unzip -q artifacts/wpessential-pro.zip -d /tmp/wordpress/wp-content/plugins
          test -f /tmp/wordpress/wp-content/plugins/wpessential/wpessential.php
          test -f /tmp/wordpress/wp-content/plugins/wpessential-pro/wpessential-pro.php

          cat > /tmp/wordpress/wp-config.php <<'PHP'
          <?php
          define('DB_NAME', getenv('WPE_TEST_WP_DB') ?: 'wpessential_test');
          define('DB_USER', getenv('WPE_TEST_MYSQL_USER') ?: 'root');
          define('DB_PASSWORD', getenv('WPE_TEST_MYSQL_PASSWORD') ?: 'root');
          define('DB_HOST', getenv('WPE_TEST_WP_DB_HOST') ?: '127.0.0.1:3306');
          define('DB_CHARSET', 'utf8mb4');
          define('DB_COLLATE', '');
          define('AUTH_KEY', 'p006-wave1g-auth-key');
          define('SECURE_AUTH_KEY', 'p006-wave1g-secure-auth-key');
          define('LOGGED_IN_KEY', 'p006-wave1g-logged-in-key');
          define('NONCE_KEY', 'p006-wave1g-nonce-key');
          define('AUTH_SALT', 'p006-wave1g-auth-salt');
          define('SECURE_AUTH_SALT', 'p006-wave1g-secure-auth-salt');
          define('LOGGED_IN_SALT', 'p006-wave1g-logged-in-salt');
          define('NONCE_SALT', 'p006-wave1g-nonce-salt');
          define('WP_DEBUG', false);
          define('DISABLE_WP_CRON', true);
          define('AUTOMATIC_UPDATER_DISABLED', true);
          define('WP_AUTO_UPDATE_CORE', false);
          define('WP_ENVIRONMENT_TYPE', 'development');
          $table_prefix = 'wpep006g_';
          require_once ABSPATH . 'wp-settings.php';
          PHP

          cat > /tmp/wordpress/wp-content/mu-plugins/p006-wave1g-core-install-network-deny.php <<'PHP'
          <?php
          add_filter('pre_http_request', static function ($preempt, $parsedArgs, $url) {
              if (function_exists('wp_installing') && wp_installing()) {
                  return new WP_Error('p006_wave1g_core_install_network_blocked', 'Core installer HTTP is denied inside the disposable P-006 fixture.');
              }
              return $preempt;
          }, PHP_INT_MIN, 3);
          PHP

          cat > /tmp/p006-wave1g-core-install.php <<'PHP'
          <?php
          declare(strict_types=1);
          $wpDir = rtrim((string) getenv('WPE_TEST_WORDPRESS_DIR'), '/\\');
          $_SERVER['HTTP_HOST'] = 'p006.test'; $_SERVER['SERVER_NAME'] = 'p006.test'; $_SERVER['SERVER_PORT'] = '80'; $_SERVER['SERVER_PROTOCOL'] = 'HTTP/1.1';
          $_SERVER['REQUEST_METHOD'] = 'GET'; $_SERVER['REMOTE_ADDR'] = '127.0.0.1'; $_SERVER['HTTPS'] = 'off'; $_SERVER['REQUEST_URI'] = '/wp-admin/install.php';
          $_SERVER['SCRIPT_NAME'] = '/index.php'; $_SERVER['PHP_SELF'] = '/index.php';
          if (!defined('WP_INSTALLING')) { define('WP_INSTALLING', true); }
          require $wpDir . '/wp-load.php'; require_once ABSPATH . 'wp-admin/includes/upgrade.php';
          if (!is_blog_installed()) {
              $installed = wp_install('WPEssential P-006 Wave 1G', 'p006_admin', 'p006-admin@example.test', false, '', 'p006-test-password-strong');
              if (is_wp_error($installed)) { fwrite(STDERR, "Disposable WordPress installation failed\n"); exit(1); }
          }
          if (function_exists('wp_installing')) { wp_installing(false); }
          if (!is_blog_installed()) { fwrite(STDERR, "Disposable WordPress installation did not reach installed state\n"); exit(1); }
          PHP
          php /tmp/p006-wave1g-core-install.php
          rm -f /tmp/p006-wave1g-core-install.php /tmp/wordpress/wp-content/mu-plugins/p006-wave1g-core-install-network-deny.php

      - name: Execute real WordPress mismatch activation evidence
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/p006-wave1g-mismatch-context-runtime-evidence.php prepare
          test -s "${WPE_P006_EVIDENCE_DIR}/activation.json"
          cat "${WPE_P006_EVIDENCE_DIR}/activation.json"

      - name: Execute Wave 1G authorized mismatch-context fixtures
        shell: bash
        run: |
          set -euo pipefail
          failure=0
          run_fixture() {
            fixture="$1"
            context="$2"
            echo "Executing ${fixture}/${WPE_P006_VARIANT_ID}/${{ matrix.cell }} context=${context}"
            if ! WPE_P006_FIXTURE_ID="${fixture}" WPE_P006_REQUEST_CONTEXT="${context}" php tools/release/p006-wave1g-mismatch-context-runtime-evidence.php verify; then
              failure=1
            fi
          }
          run_fixture FP-23 frontend
          run_fixture FP-25 admin
          run_fixture FP-26 frontend
          run_fixture FP-27 rest
          run_fixture FP-28 cron
          run_fixture FP-28 cli
          aggregate_failure=0
          if ! php tools/release/p006-wave1g-mismatch-context-runtime-evidence.php aggregate; then aggregate_failure=1; fi
          if test -s "${WPE_P006_EVIDENCE_DIR}/summary.json"; then cat "${WPE_P006_EVIDENCE_DIR}/summary.json"; fi
          test "${failure}" -eq 0
          test "${aggregate_failure}" -eq 0

      - name: Upload raw Wave 1G runtime evidence and exact candidate bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1g-${{ matrix.variant }}-${{ matrix.cell }}-evidence-${{ github.run_id }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential-pro.zip
            artifacts/p006-wave1g-candidates/p006-wave1g-candidate-identity.json
            ${{ env.WPE_P006_FREE_ZIP_PATH }}
            artifacts/p006-wave1g/${{ matrix.variant }}-${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
