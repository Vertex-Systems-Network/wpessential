name: Build ZIP

# Run it from Actions → Build ZIP → Run workflow; the installable wpessential.zip is attached
# to the run as an artifact. Pushing a tag like v3.0.1 also builds it and attaches it to a
# GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: wpessential.zip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Build admin assets
        run: |
          npm ci --no-audit --no-fund
          npm run build:admin

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          test -s artifacts/wpessential.zip
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' wpessential.php | head -1)"
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"
          sha256sum artifacts/wpessential.zip | tee artifacts/wpessential.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wpessential-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "WPEssential $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" artifacts/wpessential.zip artifacts/wpessential.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
