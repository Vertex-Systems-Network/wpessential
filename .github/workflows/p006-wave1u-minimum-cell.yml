name: P-006 Wave 1U FP-86/89/90/94 Minimum Cell

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p006-wave1u-minimum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-gate:
    name: Wave 1U latest-change gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_runtime: ${{ steps.gate.outputs.run_runtime }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether latest change requires runtime
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_runtime=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$BEFORE_SHA" ]; then
            git cat-file -e "$BEFORE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed"
            runtime_regex='^(\.github/workflows/p006-wave1u-minimum-cell\.yml|tools/p006/p006-wave1u-|tools/p006/p006-b6[abcd]-|tools/release/build-distributable\.php|tools/release/build-free-pro-distributables\.php|frameworks/Bootstrap/Plugin\.php|frameworks/Modules/Compatibility/|frameworks/Modules/CustomTables/Migration/|frameworks/Platform/Database/|frameworks/Platform/Entitlements/|wpessential\.php|wpessential-pro\.php|package\.json|package-lock\.json|admin-ui/)'
            if printf '%s\n' "$changed" | grep -Eq "$runtime_regex"; then run_runtime=true; else run_runtime=false; fi
          fi
          echo "run_runtime=$run_runtime" >> "$GITHUB_OUTPUT"
          echo "Wave 1U heavy runtime required: $run_runtime"

  build-candidates:
    name: Build and verify Wave 1U candidate graph
    needs: change-gate
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source head
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Checkout accepted canonical package source (B6a prerequisite head)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf7f5dc9dd73d13143dcc19d5c5743f1f5034ef8
          path: canonical-src
          fetch-depth: 1
          persist-credentials: false
      - name: Verify accepted canonical package source
        run: test "$(git -C canonical-src rev-parse HEAD)" = "bf7f5dc9dd73d13143dcc19d5c5743f1f5034ef8"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: canonical-src/package-lock.json
      - name: Build accepted canonical admin assets
        working-directory: canonical-src
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint:package
          npm run build:admin
      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2
      - name: Validate Wave 1U tooling
        run: |
          set -euo pipefail
          composer validate --strict
          php -l canonical-src/tools/release/build-distributable.php
          php -l tools/p006/p006-b6a-fp89-platform-api-candidate.php
          php -l tools/p006/p006-wave1u-minimum-cell.php
          bash -n tools/p006/p006-wave1u-wordpress-setup.sh
      - name: Build accepted canonical package pair twice and bind accepted F0/P0
        working-directory: canonical-src
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          cp artifacts/wpessential.zip /tmp/w1u-free.zip
          cp artifacts/wpessential-pro.zip /tmp/w1u-pro.zip
          php tools/release/build-distributable.php
          cmp --silent /tmp/w1u-free.zip artifacts/wpessential.zip
          cmp --silent /tmp/w1u-pro.zip artifacts/wpessential-pro.zip
          test "$(sha256sum artifacts/wpessential.zip | awk '{print $1}')" = "2acf6d202315e7105b89589822a95448febdc06634c0399dfcfc57b702e14d80"
          test "$(sha256sum artifacts/wpessential-pro.zip | awk '{print $1}')" = "bd74077f22c7268765519ac2d4c64dd785ba59c9eee68f5a5f1b4d8fd8de0467"
      - name: Derive accepted B6a F0/P0/P-API graph twice
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_CANONICAL_FREE_ZIP: ${{ github.workspace }}/canonical-src/artifacts/wpessential.zip
          WPE_P006_CANONICAL_PRO_ZIP: ${{ github.workspace }}/canonical-src/artifacts/wpessential-pro.zip
        run: |
          set -euo pipefail
          rm -rf artifacts/p006-wave1u
          mkdir -p artifacts/p006-wave1u/b6a-a artifacts/p006-wave1u/b6a-b
          WPE_P006_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/p006-wave1u/b6a-a" php tools/p006/p006-b6a-fp89-platform-api-candidate.php
          WPE_P006_OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/p006-wave1u/b6a-b" php tools/p006/p006-b6a-fp89-platform-api-candidate.php
          for file in f0.zip p0.zip p-api.zip candidate-identity.json; do
            cmp --silent "artifacts/p006-wave1u/b6a-a/$file" "artifacts/p006-wave1u/b6a-b/$file"
          done
          id=artifacts/p006-wave1u/b6a-a/candidate-identity.json
          test "$(jq -r '.nodes.F0.sha256' "$id")" = "2acf6d202315e7105b89589822a95448febdc06634c0399dfcfc57b702e14d80"
          test "$(jq -r '.nodes.F0.payload_tree_sha256' "$id")" = "0698d1a772704bcf44bea1eefae0c490212d6bb6ee214a4f6a5c33db1bf998b9"
          test "$(jq -r '.nodes.P0.sha256' "$id")" = "bd74077f22c7268765519ac2d4c64dd785ba59c9eee68f5a5f1b4d8fd8de0467"
          test "$(jq -r '.nodes.P0.payload_tree_sha256' "$id")" = "fbaa10957eeb482bd248ef2833b021202068ce7f420fe2d78f35b0e522b0bfd0"
          test "$(jq -r '.nodes.P_API.sha256' "$id")" = "5a2634a0d3c72ff7ede89545837c3fe2773aefad90a3fed4b060485c55645af9"
          test "$(jq -r '.nodes.P_API.payload_tree_sha256' "$id")" = "8985a20a68c7aafeee2d758845b26bddfe34ba83b5141ea335fad174acd52a69"
          test "$(jq -r '.pairs.F0_P0.pair_id_sha256' "$id")" = "28e96f5207d3dc195bbf1b1a883ea7dcea5a314580661de5400e4e299dbd5211"
          test "$(jq -r '.pairs.F0_P_API.pair_id_sha256' "$id")" = "9447c78174b7702879f318339c60942ebc20be9a477df78f9dbd2b734705d841"
          test "$(jq -r '.pairs.F0_P_API.preflight.state' "$id")" = "platform_api_too_old"
      - name: Assemble TEMP-019 immutable graph
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/p006-wave1u/candidates
          for file in f0.zip p0.zip p-api.zip; do cp "artifacts/p006-wave1u/b6a-a/$file" "artifacts/p006-wave1u/candidates/$file"; done
          jq -n \
            --arg source "$WPE_P006_SOURCE_SHA" \
            --slurpfile a artifacts/p006-wave1u/b6a-a/candidate-identity.json \
            '{
              protocol:"P-006",wave:"1U-minimum-cell",issue:1425,parent_issue:1102,source_sha:$source,
              temporary_approval_id:"GOV-P001-CF-TEMP-019",authorization:"GOV-P001-CF-TEMP-019",
              classification:"FORMAL FP-86/89/90/94 MINIMUM CELL / NON-CERTIFYING",
              prerequisites:{
                canonical_package_source_head:"bf7f5dc9dd73d13143dcc19d5c5743f1f5034ef8",
                B6a:{source_head:"bf7f5dc9dd73d13143dcc19d5c5743f1f5034ef8",run_id:35539119381},
                B6b:{source_head:"dcc15826df5989df23f3f1e588371af4038ad7d8",run_id:35539744399},
                B6c:{source_head:"46ab31e6ab6169d05c8a1c936970c2213aca1146",run_id:35540536959},
                B6d:{source_head:"6e7cef451494a5403991755b599ece560177675c",run_id:35542007281,
                     older_state_sha256:"24178a1289fb5929eda850f488d932c94bbbddc5936a82cc26cb83979823b058"}
              },
              nodes:{F0:$a[0].nodes.F0,P0:$a[0].nodes.P0,P_API:$a[0].nodes.P_API},
              pairs:{
                F0_P0:($a[0].pairs.F0_P0 + {expected_state:"compatible"}),
                F0_P_API:($a[0].pairs.F0_P_API + {expected_state:"platform_api_too_old"})
              },
              authorized_fixtures:["FP-86","FP-89","FP-90","FP-94"],
              authorized_runtime_cells:{minimum:{wordpress:"6.9",php:"8.2",mysql:"8.4"}},
              boundaries:{
                product_runtime_source_modified:false,product_di_modified:false,provider_or_remote_entitlement_used:false,
                production_or_live_data_used:false,destructive_migration_execution:false,deploy_or_release:false,
                pair_certified:false,runtime_certified:false,migration_certified:false,adr_0010:"Proposed"
              }
            }' > artifacts/p006-wave1u/candidates/wave1u-identity.json
          test "$(jq -r '.temporary_approval_id' artifacts/p006-wave1u/candidates/wave1u-identity.json)" = "GOV-P001-CF-TEMP-019"
          test "$(sha256sum artifacts/p006-wave1u/candidates/p-api.zip | cut -d' ' -f1)" = "$(jq -r '.nodes.P_API.sha256' artifacts/p006-wave1u/candidates/wave1u-identity.json)"
      - name: Upload immutable Wave 1U candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1u-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1u/candidates/
          if-no-files-found: error
          retention-days: 14
      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  minimum:
    name: FP-86/89/94 / minimum / WP 6.9 / PHP 8.2 / MySQL 8.4
    needs: [change-gate, build-candidates]
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: '6.9'
      WPE_P006_EXPECTED_PHP: '8.2'
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_LOCAL_ENTITLEMENT_STATE: pro_active
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/candidates
      WPE_P006_F0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/f0.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/p0.zip
      WPE_P006_PAPI_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/p-api.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/wave1u-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/evidence/minimum
      WPE_P006_CAPTURE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/capture
      WPE_P006_AGGREGATE_FIXTURES: FP-86 FP-89 FP-94
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip, mysqli
          coverage: none
      - name: Download exact Wave 1U graph
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1u-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1u/candidates
      - name: Validate runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WPE_P006_SOURCE_SHA"
          for file in f0.zip p0.zip p-api.zip wave1u-identity.json; do test -s "artifacts/p006-wave1u/candidates/$file"; done
          php -l tools/p006/p006-wave1u-minimum-cell.php
          php -l tools/p006/p006-b6b-fp86-fail-once-marker.php
          php -l tools/p006/p006-b6c-fp94-diagnostics-redaction.php
          php -l tools/p006/p006-b6d-fp90-disposable-db-snapshot.php
          bash -n tools/p006/p006-wave1u-wordpress-setup.sh
          bash -n tools/p006/p006-b6b-wordpress-setup.sh
          bash -n tools/p006/p006-b6d-wordpress-setup.sh
          ids="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | sed '/^$/d')"
          test "$(printf '%s\n' "$ids" | wc -l)" -eq 1
          echo "MYSQL_CONTAINER_ID=$ids" >> "$GITHUB_ENV"
      - name: Execute formal FP-86/89/94 scenarios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WPE_P006_EVIDENCE_DIR" "$WPE_P006_CAPTURE_DIR"
          cap="$WPE_P006_CAPTURE_DIR"
          captured() {
            local name="$1"; shift
            if ! "$@" >> "$cap/$name.stdout.log" 2>> "$cap/$name.stderr.log"; then
              echo "Wave 1U step failed: $name" >&2
              cat "$cap/$name.stdout.log" "$cap/$name.stderr.log" >&2 || true
              exit 1
            fi
          }
          wave1u() {
            local mode="$1" file="$2"
            captured "wave1u-$mode" env WPE_P006_EXECUTION_MODE="$mode" WPE_P006_EVIDENCE_FILE="$file" \
              php tools/p006/p006-wave1u-minimum-cell.php
          }

          # FP-86: compose accepted B6b fail-once marker harness on migration 220.
          export WPE_TEST_WORDPRESS_DIR=/tmp/wordpress WPE_TEST_WP_DB=wpessential_test WPE_P006_TABLE_PREFIX=wpep006b6b_
          export WPE_P006_NETWORK_LOG="$cap/fp86-network.log" WPE_P006_SQL_LOG="$cap/fp86-sql.log"
          : > "$WPE_P006_SQL_LOG"
          captured b6b-setup bash tools/p006/p006-b6b-wordpress-setup.sh
          captured b6b env WPE_P006_EVIDENCE_FILE="$cap/b6b-evidence.json" php tools/p006/p006-b6b-fp86-fail-once-marker.php
          WPE_P006_B6B_EVIDENCE="$cap/b6b-evidence.json" wave1u fp86 fp86.json

          # FP-89: isolated API-incompatible Pro candidate rejected before premium boot/migrations.
          export WPE_TEST_WORDPRESS_DIR=/tmp/wordpress WPE_TEST_WP_DB=wpessential_test WPE_P006_TABLE_PREFIX=wpep006u89_
          export WPE_P006_NETWORK_LOG="$cap/fp89-network.log" WPE_P006_SQL_LOG="$cap/fp89-sql.log" WPE_P006_ERROR_LOG="$cap/fp89-php-error.log"
          captured wave1u-setup bash tools/p006/p006-wave1u-wordpress-setup.sh
          wave1u fp89-install fp89-install.json
          wave1u fp89-activate fp89-before.json
          wave1u fp89 fp89.json

          # FP-94: canary redaction across every surface captured during the formal FP-86/89 scenarios (FP-90 runs in its own job).
          mkdir -p "$cap/b6c"
          : > "$cap/b6c/php-error.log"
          captured b6c env WPE_P006_EVIDENCE_FILE="$cap/b6c/evidence.json" WPE_P006_ERROR_LOG="$cap/b6c/php-error.log" \
            WPE_P006_STDERR_CAPTURE="$cap/b6c.stderr.log" php tools/p006/p006-b6c-fp94-diagnostics-redaction.php
          WPE_P006_B6C_EVIDENCE="$cap/b6c/evidence.json" \
          WPE_P006_CAPTURE_PATHS="$WPE_P006_EVIDENCE_DIR $cap" \
            wave1u fp94 fp94.json

          wave1u aggregate summary.json
          for canary in \
            P006_W1U_LICENSE_TOKEN_DO_NOT_EMIT P006_W1U_VAULT_PLAINTEXT_DO_NOT_EMIT P006_W1U_PRIVATE_USER_DATA_DO_NOT_EMIT \
            P006_B6C_LICENSE_TOKEN_DO_NOT_EMIT P006_B6C_VAULT_PLAINTEXT_DO_NOT_EMIT P006_B6C_PRIVATE_USER_DATA_DO_NOT_EMIT
          do
            if grep -R -F -- "$canary" "$WPE_P006_EVIDENCE_DIR" "$cap" >/dev/null; then
              echo "Raw canary leaked into captured artifact" >&2
              exit 1
            fi
          done
          test "$(jq -r '.status' "$WPE_P006_EVIDENCE_DIR/summary.json")" = "PASS"
          test "$(jq -r '.accounting_if_terminally_accepted.executed' "$WPE_P006_EVIDENCE_DIR/summary.json")" = "60"
          cat "$WPE_P006_EVIDENCE_DIR/summary.json"
      - name: Upload immutable runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1u-minimum-${{ github.run_id }}
          path: |
            artifacts/p006-wave1u/candidates/wave1u-identity.json
            artifacts/p006-wave1u/evidence/minimum/
            artifacts/p006-wave1u/capture/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  fp90:
    name: FP-90 / minimum / WP 6.9 / PHP 8.2 / MySQL 8.4
    needs: [change-gate, build-candidates]
    if: needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: '6.9'
      WPE_P006_EXPECTED_PHP: '8.2'
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_LOCAL_ENTITLEMENT_STATE: pro_active
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/candidates
      WPE_P006_F0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/f0.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/p0.zip
      WPE_P006_PAPI_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/p-api.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1u/candidates/wave1u-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/evidence/fp90
      WPE_P006_CAPTURE_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/capture-fp90
      WPE_P006_B6D_ACCEPTED_DIR: ${{ github.workspace }}/artifacts/p006-wave1u/b6d-accepted
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip, mysqli
          coverage: none
      - name: Download exact Wave 1U graph
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1u-candidates-${{ github.run_id }}
          path: artifacts/p006-wave1u/candidates
      - name: Download accepted B6d older-state snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-b6d-fp90-prerequisite-35542007281
          run-id: 35542007281
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/p006-wave1u/b6d-accepted
      - name: Validate runtime inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WPE_P006_SOURCE_SHA"
          for file in f0.zip p0.zip p-api.zip wave1u-identity.json; do test -s "artifacts/p006-wave1u/candidates/$file"; done
          test "$(sha256sum "$WPE_P006_B6D_ACCEPTED_DIR/older-state.sql" | awk '{print $1}')" = "24178a1289fb5929eda850f488d932c94bbbddc5936a82cc26cb83979823b058"
          test -s "$WPE_P006_B6D_ACCEPTED_DIR/before.json"
          php -l tools/p006/p006-wave1u-minimum-cell.php
          php -l tools/p006/p006-b6d-fp90-disposable-db-snapshot.php
          bash -n tools/p006/p006-b6d-wordpress-setup.sh
          ids="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | sed '/^$/d')"
          test "$(printf '%s\n' "$ids" | wc -l)" -eq 1
          echo "MYSQL_CONTAINER_ID=$ids" >> "$GITHUB_ENV"
      - name: Execute formal FP-90 scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WPE_P006_EVIDENCE_DIR" "$WPE_P006_CAPTURE_DIR"
          cap="$WPE_P006_CAPTURE_DIR"
          captured() {
            local name="$1"; shift
            if ! "$@" >> "$cap/$name.stdout.log" 2>> "$cap/$name.stderr.log"; then
              echo "Wave 1U step failed: $name" >&2
              cat "$cap/$name.stdout.log" "$cap/$name.stderr.log" >&2 || true
              exit 1
            fi
          }
          wave1u() {
            local mode="$1" file="$2"
            captured "wave1u-$mode" env WPE_P006_EXECUTION_MODE="$mode" WPE_P006_EVIDENCE_FILE="$file" \
              php tools/p006/p006-wave1u-minimum-cell.php
          }

          # FP-90: accepted older-state snapshot, compatibility first, then current non-destructive 220/221.
          export WPE_TEST_WORDPRESS_DIR=/tmp/wordpress WPE_TEST_WP_DB=wpessential_b6d WPE_P006_TABLE_PREFIX=wpep006b6d_
          export WPE_P006_NETWORK_LOG="$cap/fp90-network.log" WPE_P006_SQL_LOG="$cap/fp90-sql.log"
          : > "$WPE_P006_SQL_LOG"
          docker exec -e MYSQL_PWD="$WPE_TEST_MYSQL_PASSWORD" "$MYSQL_CONTAINER_ID" mysql -u"$WPE_TEST_MYSQL_USER" \
            -e 'DROP DATABASE IF EXISTS `wpessential_b6d`; CREATE DATABASE `wpessential_b6d` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          docker exec -i -e MYSQL_PWD="$WPE_TEST_MYSQL_PASSWORD" "$MYSQL_CONTAINER_ID" mysql -u"$WPE_TEST_MYSQL_USER" wpessential_b6d \
            < "$WPE_P006_B6D_ACCEPTED_DIR/older-state.sql"
          captured b6d-setup bash tools/p006/p006-b6d-wordpress-setup.sh
          export WPE_P006_BEFORE_EVIDENCE="$WPE_P006_B6D_ACCEPTED_DIR/before.json"
          export WPE_P006_RESTORED_EVIDENCE="$cap/b6d-restored.json" WPE_P006_COMPATIBILITY_EVIDENCE="$cap/b6d-compatibility.json"
          captured b6d-verify-restored env WPE_P006_EXECUTION_MODE=verify-restored php tools/p006/p006-b6d-fp90-disposable-db-snapshot.php
          captured b6d-compatibility env WPE_P006_EXECUTION_MODE=compatibility php tools/p006/p006-b6d-fp90-disposable-db-snapshot.php
          WPE_P006_B6D_ACCEPTED_SNAPSHOT="$WPE_P006_B6D_ACCEPTED_DIR/older-state.sql" \
          WPE_P006_B6D_RESTORED_EVIDENCE="$cap/b6d-restored.json" \
          WPE_P006_B6D_COMPATIBILITY_EVIDENCE="$cap/b6d-compatibility.json" \
            wave1u fp90 fp90.json

          export WPE_P006_AGGREGATE_FIXTURES=FP-90
          wave1u aggregate summary.json
          for canary in \
            P006_W1U_LICENSE_TOKEN_DO_NOT_EMIT P006_W1U_VAULT_PLAINTEXT_DO_NOT_EMIT P006_W1U_PRIVATE_USER_DATA_DO_NOT_EMIT \
            P006_B6C_LICENSE_TOKEN_DO_NOT_EMIT P006_B6C_VAULT_PLAINTEXT_DO_NOT_EMIT P006_B6C_PRIVATE_USER_DATA_DO_NOT_EMIT
          do
            if grep -R -F -- "$canary" "$WPE_P006_EVIDENCE_DIR" "$cap" >/dev/null; then
              echo "Raw canary leaked into captured artifact" >&2
              exit 1
            fi
          done
          test "$(jq -r '.status' "$WPE_P006_EVIDENCE_DIR/summary.json")" = "PASS"
          cat "$WPE_P006_EVIDENCE_DIR/summary.json"
      - name: Upload immutable runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1u-fp90-${{ github.run_id }}
          path: |
            artifacts/p006-wave1u/candidates/wave1u-identity.json
            artifacts/p006-wave1u/evidence/fp90/
            artifacts/p006-wave1u/capture-fp90/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  terminal:
    name: Wave 1U terminal aggregate
    needs: [change-gate, build-candidates, minimum, fp90]
    if: always() && needs.change-gate.outputs.run_runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build-candidates.result }}
      MINIMUM_RESULT: ${{ needs.minimum.result }}
      FP90_RESULT: ${{ needs.fp90.result }}
    steps:
      - name: Record terminal result
        run: |
          set -euo pipefail
          status=FAIL
          if [ "$BUILD_RESULT" = "success" ] && [ "$MINIMUM_RESULT" = "success" ] && [ "$FP90_RESULT" = "success" ]; then status=PASS; fi
          # Per-fixture outcome: PASS only when its job succeeded; otherwise not-executed (never claimed).
          min_outcome=NOT_EXECUTED; fp90_outcome=NOT_EXECUTED
          if [ "$BUILD_RESULT" = "success" ] && [ "$MINIMUM_RESULT" = "success" ]; then min_outcome=PASS; fi
          if [ "$BUILD_RESULT" = "success" ] && [ "$FP90_RESULT" = "success" ]; then fp90_outcome=PASS; fi
          executed=57
          if [ "$min_outcome" = "PASS" ]; then executed=$((executed + 3)); fi
          if [ "$fp90_outcome" = "PASS" ]; then executed=$((executed + 1)); fi
          mkdir -p artifacts/p006-wave1u/terminal
          jq -n --arg status "$status" --arg build "$BUILD_RESULT" --arg minimum "$MINIMUM_RESULT" --arg fp90 "$FP90_RESULT" \
            --arg min_outcome "$min_outcome" --arg fp90_outcome "$fp90_outcome" --argjson executed "$executed" '{
            status:$status,protocol:"P-006",wave:"1U",issue:1425,parent_issue:1102,fixtures:["FP-86","FP-89","FP-90","FP-94"],
            authorization:"GOV-P001-CF-TEMP-019",classification:"FORMAL MINIMUM-CELL EVIDENCE / NON-CERTIFYING",
            cell:{wordpress:"6.9",php:"8.2",mysql:"8.4"},
            build_result:$build,
            partial_result:{fp86_fp89_fp94_job_result:$minimum,fp90_job_result:$fp90},
            fixture_outcomes:{"FP-86":$min_outcome,"FP-89":$min_outcome,"FP-94":$min_outcome,"FP-90":$fp90_outcome},
            accounting_before:{documented:144,executed:57,pass:57,fail:0,inconclusive:0},
            accounting_observed:{documented:144,executed:$executed,pass:$executed,fail:0,inconclusive:0},
            accounting_if_all_pass:{documented:144,executed:61,pass:61,fail:0,inconclusive:0},
            destructive_migration_executed:false,provider_or_remote_entitlement_used:false,production_or_live_data_used:false,
            pair_certified:false,runtime_certified:false,migration_certified:false,permanent_p001_cf_certified:false,
            updater_or_tuf_certified:false,adr_0010:"Proposed",ga_or_release_authorized:false
          }' > artifacts/p006-wave1u/terminal/terminal.json
          cat artifacts/p006-wave1u/terminal/terminal.json
      - name: Upload terminal marker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1u-terminal-${{ github.run_id }}
          path: artifacts/p006-wave1u/terminal/terminal.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce terminal success
        run: |
          test "$BUILD_RESULT" = "success"
          test "$MINIMUM_RESULT" = "success"
          test "$FP90_RESULT" = "success"
