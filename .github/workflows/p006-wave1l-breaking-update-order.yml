      - name: Record FP-48 breaking F1/P2 degradation
        shell: bash
        env:
          WPE_P006_EXECUTION_MODE: observe
          WPE_P006_EXPECTED_FREE_NODE: F1
          WPE_P006_EXPECTED_PRO_NODE: P2
          WPE_P006_EXPECTED_FREE_INSTANCE: f1
          WPE_P006_EXPECTED_PRO_INSTANCE: p2
          WPE_P006_EXPECTED_STATE: free_version_too_old
          WPE_P006_FIXTURE_ID: FP-48
          WPE_P006_PHASE: pro-first-breaking
          WPE_P006_EVIDENCE_FILE: breaking.json
        run: php tools/p006/p006-wave1l-runtime-evidence.php

      - name: Aggregate FP-48 terminal evidence
