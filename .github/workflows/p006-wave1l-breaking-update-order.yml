    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: minimum
            wordpress: '6.9'
            php: '8.2'
          - cell: reference
            wordpress: '7.1'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_CANDIDATE_DIR: ${{ github.workspace }}/artifacts/p006-wave1l/candidates
      WPE_P006_F1_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1l/candidates/f1.zip
      WPE_P006_F2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1l/candidates/f2.zip
      WPE_P006_P0_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1l/candidates/p0.zip
      WPE_P006_P2_ZIP_PATH: ${{ github.workspace }}/artifacts/p006-wave1l/candidates/p2.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1l/candidates/candidate-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1l/fp48/${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1l-fp48-${{ matrix.cell }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
