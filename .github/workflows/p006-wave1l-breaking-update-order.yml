        run: php tools/p006/p006-wave1l-runtime-evidence.php

      - name: Atomically switch complete Pro P0 to P2
        shell: bash
        env:
          WPE_P006_SWAP_PLUGIN: pro
          WPE_P006_SWAP_TARGET: p2
