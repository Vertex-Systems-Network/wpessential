name: Fix Bulk Unverified V2

on:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1
    paths:
      - '.github/workflows/fix-bulk-unverified-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/columns-fields-bulk-edit-v1
          fetch-depth: 0
      - name: Apply exact contract fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('admin-ui/src/columns-runtime.ts')
          source = runtime.read_text()
          if source.count('failedPostIds') != 5:
              raise SystemExit(f'unexpected failedPostIds count: {source.count("failedPostIds")}')
          if source.count('failureDetail') != 2:
              raise SystemExit(f'unexpected failureDetail count: {source.count("failureDetail")}')
          source = source.replace('failedPostIds', 'unverifiedPostIds')
          source = source.replace('failureDetail', 'unverifiedDetail')
          old_detail = "? ` Failed post IDs: ${ unverifiedPostIds.join( ', ' ) }.`"
          new_detail = "? ` Unverified post IDs: ${ unverifiedPostIds.join( ', ' ) }. Refresh before retrying because the owner may have applied the attempted write.`"
          if source.count(old_detail) != 1:
              raise SystemExit('expected failed detail fragment exactly once')
          source = source.replace(old_detail, new_detail, 1)
          old_summary = "${ unverifiedPostIds.length } failed, ${ notAttemptedIds.length } not attempted."
          new_summary = "${ unverifiedPostIds.length } unverified, ${ notAttemptedIds.length } not attempted."
          if source.count(old_summary) != 1:
              raise SystemExit('expected failed summary fragment exactly once')
          source = source.replace(old_summary, new_summary, 1)
          runtime.write_text(source)

          test = Path('tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php')
          test_source = test.read_text()
          replacements = [
              ('testAttemptedBulkMutationReportsPartialFailuresAndInvalidatesPreview', 'testAttemptedBulkMutationReportsUnverifiedOutcomesAndInvalidatesPreview'),
              ("self::assertStringContainsString('const failedPostIds: number[] = [];', $source);", "self::assertStringContainsString('const unverifiedPostIds: number[] = [];', $source);"),
              ("self::assertStringContainsString('failedPostIds.push( postId );', $source);", "self::assertStringContainsString('unverifiedPostIds.push( postId );', $source);\n        self::assertStringContainsString('Unverified post IDs:', $source);\n        self::assertStringContainsString('unverified,', $source);"),
          ]
          for old, new in replacements:
              if test_source.count(old) != 1:
                  raise SystemExit(f'unexpected test fragment count for {old!r}: {test_source.count(old)}')
              test_source = test_source.replace(old, new, 1)
          test.write_text(test_source)

          doc = Path('docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md')
          doc_source = doc.read_text()
          replacements = [
              ('A failed row does not make previous successful owner writes disappear and is never misreported as success. The operator receives a bounded summary containing:', 'An attempted row without a complete validated owner response is not treated as a verified failure: its outcome is unverified because the owner may have committed the write before the browser lost or rejected the response. Previous verified successes remain authoritative. The operator receives a bounded summary containing:'),
              ('- failed post ids;', '- unverified post ids for attempted writes that did not return a complete validated owner response;'),
              ('all-success, partial failure, or all-failure.', 'all-success, mixed verified/unverified, or all-unverified.'),
          ]
          for old, new in replacements:
              if doc_source.count(old) != 1:
                  raise SystemExit(f'unexpected doc fragment count for {old!r}: {doc_source.count(old)}')
              doc_source = doc_source.replace(old, new, 1)
          doc.write_text(doc_source)

          Path('.github/workflows/fix-bulk-unverified-v2.yml').unlink()
          PY
      - name: Commit clean three-file patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-ui/src/columns-runtime.ts docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php .github/workflows/fix-bulk-unverified-v2.yml
          git diff --cached --check
          git commit -m 'fix: classify uncertain bulk writes as unverified'
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
