name: Temporary Admin Columns lifecycle feedback hardening

on:
  push:
    branches:
      - agent/admin-columns-view-lifecycle-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/admin-columns-view-lifecycle-v1
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Preserve lifecycle result feedback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('admin-ui/src/columns-runtime.ts')
          s = p.read_text()
          old = """\t\t} finally {\n\t\t\tinFlight = false;\n\t\t\tsync();\n\t\t}\n\t} );\n}\n\nfunction wirePreview(\n"""
          new = """\t\t} finally {\n\t\t\tinFlight = false;\n\t\t\tselect.disabled = false;\n\t\t\tapply.disabled = false;\n\t\t}\n\t} );\n}\n\nfunction wirePreview(\n"""
          if s.count(old) != 1:
              raise SystemExit(f'lifecycle finally block occurrences: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          npm ci --ignore-scripts
          npm run lint:js -- --fix
          npm run typecheck
          npm run build
      - name: Commit normalized runtime and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-columns-view-lifecycle-message-v1.yml
          git add admin-ui/src/columns-runtime.ts
          git diff --cached --check
          git commit -m "fix(columns): preserve lifecycle transition feedback"
          git push origin HEAD:agent/admin-columns-view-lifecycle-v1
