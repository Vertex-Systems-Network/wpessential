name: Gate C Reconciliation Workbench

on:
  push:
    branches:
      - supervisor/query-gate-c-pass-reconcile-v1

permissions:
  contents: write

concurrency:
  group: gate-c-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact reconciliation ancestry and workbench-only pre-diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c41158f6baf98912ca76108ec74bc685afe802f7 HEAD
          mapfile -t changed < <(git diff --name-only c41158f6baf98912ca76108ec74bc685afe802f7...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/gate-c-reconcile-workbench.yml"
          test "${changed[1]}" = "tools/reconcile_query_gate_c.py"

      - name: Apply exact Gate C closure reconciliation
        run: python3 tools/reconcile_query_gate_c.py

      - name: Validate reconciled shared truth
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/coordination/agent-work-queue.json >/dev/null
          grep -F 'Gate C — PASS for the certified bounded V1 baseline' CHECKPOINT.md
          grep -F 'Gate D — ACTIVE' CHECKPOINT.md
          grep -F 'Status: **PASS FOR CERTIFIED BOUNDED V1 BASELINE**' docs/IMPLEMENTATION/QUERY-GATE-C-CLOSURE-AUDIT-V1.md
          grep -F '"status": "BLOCKED"' config/coordination/agent-work-queue.json

      - name: Remove disposable workbench files
        shell: bash
        run: |
          set -euo pipefail
          rm tools/reconcile_query_gate_c.py
          rm .github/workflows/gate-c-reconcile-workbench.yml

      - name: Prove final diff is exactly shared truth scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}" | grep -Fx 'CHECKPOINT.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'config/coordination/agent-work-queue.json'
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/IMPLEMENTATION/QUERY-GATE-C-CLOSURE-AUDIT-V1.md'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/gate-c-reconcile-workbench.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tools/reconcile_query_gate_c.py'

      - name: Commit clean reconciliation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPEssential Supervisor'
          git config user.email 'wordpress.essential@gmail.com'
          git add CHECKPOINT.md config/coordination/agent-work-queue.json docs/IMPLEMENTATION/QUERY-GATE-C-CLOSURE-AUDIT-V1.md .github/workflows/gate-c-reconcile-workbench.yml tools/reconcile_query_gate_c.py
          git commit -m 'chore(coordination): close Query Gate C and open Gate D lanes'
          git push origin HEAD:supervisor/query-gate-c-pass-reconcile-v1
