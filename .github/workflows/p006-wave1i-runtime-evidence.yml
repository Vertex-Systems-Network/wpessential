name: P-006 Wave 1I Real WordPress Evidence

on:
  pull_request:
    paths:
      - 'frameworks/Modules/Compatibility/**'
      - 'frameworks/Bootstrap/**'
      - 'frameworks/Platform/**'
      - 'wpessential.php'
      - 'wpessential-pro.php'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'admin-ui/**'
      - 'tools/release/build-distributable.php'
      - 'tools/release/build-free-pro-distributables.php'
      - 'tools/p006/p006-wave1i-runtime-evidence.php'
      - 'tools/p006/p006-wave1i-wordpress-setup.sh'
      - '.github/workflows/p006-wave1i-runtime-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p006-wave1i-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidates:
    name: Build and pin immutable Wave 1I candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install locked admin build graph
        run: npm ci --ignore-scripts

      - name: Validate package manifest and build production admin assets
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:package
          npm run build:admin

      - name: Set up PHP 8.2 packaging runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Validate Wave 1I tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php -l wpessential.php
          php -l wpessential-pro.php
          php -l frameworks/Modules/Compatibility/LocalCompatibilityPreflight.php
          php -l tools/release/build-distributable.php
          php -l tools/release/build-free-pro-distributables.php
          php -l tools/p006/p006-wave1i-runtime-evidence.php
          bash -n tools/p006/p006-wave1i-wordpress-setup.sh
          php -r 'if (!class_exists("ZipArchive")) { fwrite(STDERR, "ZipArchive unavailable\n"); exit(1); }'

      - name: Build first immutable candidate set
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          for artifact in             artifacts/wpessential.zip             artifacts/wpessential-package.json             artifacts/wpessential-pro.zip             artifacts/wpessential-pro-package.json
          do
            test -s "${artifact}"
          done
          cp artifacts/wpessential.zip /tmp/p006-wave1i-free-first.zip
          cp artifacts/wpessential-pro.zip /tmp/p006-wave1i-pro-first.zip
          sha256sum artifacts/wpessential.zip | tee /tmp/p006-wave1i-free-first.sha256
          sha256sum artifacts/wpessential-pro.zip | tee /tmp/p006-wave1i-pro-first.sha256

      - name: Rebuild and prove deterministic candidate identity
        shell: bash
        run: |
          set -euo pipefail
          php tools/release/build-distributable.php
          free_first="$(cut -d' ' -f1 /tmp/p006-wave1i-free-first.sha256)"
          pro_first="$(cut -d' ' -f1 /tmp/p006-wave1i-pro-first.sha256)"
          free_second="$(sha256sum artifacts/wpessential.zip | cut -d' ' -f1)"
          pro_second="$(sha256sum artifacts/wpessential-pro.zip | cut -d' ' -f1)"
          test "${free_first}" = "${free_second}"
          test "${pro_first}" = "${pro_second}"
          cmp --silent /tmp/p006-wave1i-free-first.zip artifacts/wpessential.zip
          cmp --silent /tmp/p006-wave1i-pro-first.zip artifacts/wpessential-pro.zip

      - name: Record exact authorized candidate identities before runtime
        shell: bash
        env:
          WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
          WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
          WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1i/candidate-identity.json
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1i-runtime-evidence.php identity
          test -s artifacts/p006-wave1i/candidate-identity.json
          cat artifacts/p006-wave1i/candidate-identity.json

      - name: Upload immutable Wave 1I candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1i-candidates-${{ github.run_id }}
          path: |
            artifacts/wpessential.zip
            artifacts/wpessential-package.json
            artifacts/wpessential-pro.zip
            artifacts/wpessential-pro-package.json
            artifacts/p006-wave1i/candidate-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  fp34-load-order:
    name: FP-34 / ${{ matrix.cell }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: build-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: minimum
            wordpress: '6.9'
            php: '8.2'
          - cell: reference
            wordpress: '7.1'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
      WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1i/candidate-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1i/fp34/${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1i-fp34-${{ matrix.cell }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none

      - name: Download exact immutable candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1i-candidates-${{ github.run_id }}
          path: artifacts

      - name: Verify downloaded candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          test -s artifacts/p006-wave1i/candidate-identity.json

      - name: Prepare isolated disposable WordPress
        shell: bash
        run: bash tools/p006/p006-wave1i-wordpress-setup.sh

      - name: Activate exact pair under outbound HTTP denial
        shell: bash
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1i-runtime-evidence.php prepare
          test -s "${WPE_P006_EVIDENCE_DIR}/prepare.json"

      - name: Execute genuine FP-34 WordPress load-order variation
        shell: bash
        run: |
          set -euo pipefail
          for order in free-pro pro-free; do
            echo "FP-34 ${{ matrix.cell }} order=${order}"
            WPE_P006_LOAD_ORDER="${order}" php tools/p006/p006-wave1i-runtime-evidence.php set-order
            WPE_P006_LOAD_ORDER="${order}" php tools/p006/p006-wave1i-runtime-evidence.php fp34
          done
          php tools/p006/p006-wave1i-runtime-evidence.php fp34-aggregate
          test -s "${WPE_P006_EVIDENCE_DIR}/fp34-summary.json"
          cat "${WPE_P006_EVIDENCE_DIR}/fp34-summary.json"

      - name: Upload FP-34 raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1i-fp34-${{ matrix.cell }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1i/candidate-identity.json
            artifacts/p006-wave1i/fp34/${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  fp44-preflight-cost:
    name: FP-44 / ${{ matrix.cell }} / WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / MySQL 8.4
    needs: build-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: minimum
            wordpress: '6.9'
            php: '8.2'
          - cell: reference
            wordpress: '7.1'
            php: '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      WPE_P006_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      WPE_P006_EXPECTED_WP: ${{ matrix.wordpress }}
      WPE_P006_EXPECTED_PHP: ${{ matrix.php }}
      WPE_P006_EXPECTED_MYSQL: '8.4'
      WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
      WPE_TEST_WP_DB: wpessential_test
      WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
      WPE_TEST_MYSQL_USER: root
      WPE_TEST_MYSQL_PASSWORD: root
      WPE_P006_FREE_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential.zip
      WPE_P006_PRO_ZIP_PATH: ${{ github.workspace }}/artifacts/wpessential-pro.zip
      WPE_P006_IDENTITY_PATH: ${{ github.workspace }}/artifacts/p006-wave1i/candidate-identity.json
      WPE_P006_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/p006-wave1i/fp44/${{ matrix.cell }}
      WPE_P006_NETWORK_LOG: /tmp/p006-wave1i-fp44-${{ matrix.cell }}-network.log

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_P006_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up authorized PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mysqli
          coverage: none

      - name: Download exact immutable candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p006-wave1i-candidates-${{ github.run_id }}
          path: artifacts

      - name: Verify downloaded candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/wpessential.zip
          test -s artifacts/wpessential-pro.zip
          test -s artifacts/p006-wave1i/candidate-identity.json

      - name: Prepare isolated disposable WordPress
        shell: bash
        run: bash tools/p006/p006-wave1i-wordpress-setup.sh

      - name: Activate exact pair under outbound HTTP denial
        shell: bash
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1i-runtime-evidence.php prepare
          test -s "${WPE_P006_EVIDENCE_DIR}/prepare.json"

      - name: Pin canonical Free then Pro active order
        shell: bash
        env:
          WPE_P006_LOAD_ORDER: free-pro
        run: php tools/p006/p006-wave1i-runtime-evidence.php set-order

      - name: Execute predeclared FP-44 cost and zero-network evidence
        shell: bash
        run: |
          set -euo pipefail
          php tools/p006/p006-wave1i-runtime-evidence.php fp44
          test -s "${WPE_P006_EVIDENCE_DIR}/fp44.json"
          cat "${WPE_P006_EVIDENCE_DIR}/fp44.json"

      - name: Upload FP-44 raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p006-wave1i-fp44-${{ matrix.cell }}-${{ github.run_id }}
          path: |
            artifacts/p006-wave1i/candidate-identity.json
            artifacts/p006-wave1i/fp44/${{ matrix.cell }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
