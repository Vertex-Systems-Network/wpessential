name: Format Bulk Unverified V1

on:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1
    paths:
      - '.github/workflows/format-bulk-unverified-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/columns-fields-bulk-edit-v1
          fetch-depth: 0
      - name: Apply exact Prettier formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin-ui/src/columns-runtime.ts')
          source = path.read_text()
          old = "${ unverifiedPostIds.join( ', ' ) }"
          new = "${ unverifiedPostIds.join(\n\t\t\t\t\t\t\t\t', '\n\t\t\t\t\t\t  ) }"
          if source.count(old) != 1:
              raise SystemExit(f'expected formatting target once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/format-bulk-unverified-v1.yml').unlink()
      - name: Commit clean formatting fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-ui/src/columns-runtime.ts .github/workflows/format-bulk-unverified-v1.yml
          git diff --cached --check
          git commit -m 'style: format bulk unverified detail'
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
