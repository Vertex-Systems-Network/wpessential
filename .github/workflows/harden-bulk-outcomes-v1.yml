name: Harden Bulk Outcomes V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1
    paths:
      - '.github/workflows/harden-bulk-outcomes-v1.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/agent/columns-fields-bulk-edit-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply conservative bulk-outcome hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('admin-ui/src/columns-runtime.ts')
          source = runtime.read_text()
          runtime_replacements = [
              ('failedPostIds', 'unverifiedPostIds', 5),
              ('failureDetail', 'unverifiedDetail', 2),
              ('Failed post IDs:', 'Unverified post IDs:', 1),
              ('${ unverifiedPostIds.length } failed,', '${ unverifiedPostIds.length } unverified,', 1),
          ]
          for old, new, expected in runtime_replacements:
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'unexpected runtime fragment count for {old!r}: {count}')
              source = source.replace(old, new)
          warning_anchor = "` Unverified post IDs: ${ unverifiedPostIds.join( ', ' ) }.`"
          warning_value = "` Unverified post IDs: ${ unverifiedPostIds.join( ', ' ) }. Server state may have changed; refresh before retrying.`"
          if source.count(warning_anchor) != 1:
              raise SystemExit('missing unverified warning anchor')
          source = source.replace(warning_anchor, warning_value, 1)
          runtime.write_text(source)

          contract = Path('tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php')
          source = contract.read_text()
          contract_replacements = [
              ('testAttemptedBulkMutationReportsPartialFailuresAndInvalidatesPreview', 'testAttemptedBulkMutationReportsUnverifiedOutcomesAndInvalidatesPreview'),
              ('const failedPostIds: number[] = [];', 'const unverifiedPostIds: number[] = [];'),
              ('failedPostIds.push( postId );', 'unverifiedPostIds.push( postId );'),
          ]
          for old, new in contract_replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected contract fragment count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)
          anchor = "        self::assertStringContainsString('Bulk Fields edit finished:', $source);"
          extra = [
              "        self::assertStringContainsString('Unverified post IDs:', $source);",
              "        self::assertStringContainsString('Server state may have changed; refresh before retrying.', $source);",
              "        self::assertStringContainsString('unverified, ${ notAttemptedIds.length } not attempted.', $source);",
              "        self::assertStringNotContainsString('const failedPostIds: number[] = [];', $source);",
          ]
          if source.count(anchor) != 1:
              raise SystemExit('missing bulk summary contract anchor')
          source = source.replace(anchor, anchor + chr(10) + chr(10).join(extra), 1)
          contract.write_text(source)

          doc = Path('docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md')
          source = doc.read_text()
          doc_replacements = [
              ('## Execution and partial failures', '## Execution and partial outcomes'),
              ('A failed row does not make previous successful owner writes disappear and is never misreported as success. The operator receives a bounded summary containing:', 'An attempted row is reported as verified only after that complete owner response passes validation. The shared request seam currently collapses transport, HTTP/server-envelope, decode, malformed, and stale-response errors into the same exception boundary, so a caught attempted row is conservatively reported as **unverified** rather than being misreported as failed or successful. The operator receives a bounded summary containing:'),
              ('- failed post ids;', '- unverified post ids, with an explicit refresh-before-retry warning;'),
              ('No atomic rollback claim is made. Owner writes already verified as successful remain owner truth.', 'No atomic rollback claim is made. Owner writes already verified as successful remain owner truth, and unverified rows must be re-read through Preview before any retry decision.'),
              ('regardless of whether the outcome was all-success, partial failure, or all-failure.', 'regardless of whether the outcome was all-verified, mixed/unverified, or no verified writes.'),
          ]
          for old, new in doc_replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected doc fragment count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)
          doc.write_text(source)
          PY

      - name: Install locked admin graph
        run: npm ci --ignore-scripts

      - name: Format hardened runtime
        run: npx prettier --write admin-ui/src/columns-runtime.ts

      - name: Formatter gate
        run: npx prettier --check admin-ui/src/columns-runtime.ts

      - name: JavaScript lint gate
        run: npm run lint:js

      - name: TypeScript gate
        run: npm run typecheck

      - name: Admin build gate
        run: npm run build:admin

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: dom, filter, libxml, mbstring, tokenizer, xml, xmlreader, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install locked PHP graph
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Focused bulk contract
        run: vendor/bin/phpunit tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php

      - name: Commit hardened patch and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/harden-bulk-outcomes-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-ui/src/columns-runtime.ts tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md .github/workflows/harden-bulk-outcomes-v1.yml
          git diff --cached --check
          git commit -m 'fix: classify uncertain bulk writes as unverified'
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
