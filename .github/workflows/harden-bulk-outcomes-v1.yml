name: Harden Bulk Outcomes V1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1
    paths:
      - '.github/workflows/harden-bulk-outcomes-v1.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.ref == 'refs/heads/agent/columns-fields-bulk-edit-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply conservative bulk-outcome wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('admin-ui/src/columns-runtime.ts')
          source = runtime.read_text()
          replacements = [
              (
                  "? ` Failed post IDs: ${ failedPostIds.join( ', ' ) }.`",
                  "? ` Unverified post IDs: ${ failedPostIds.join( ', ' ) }. Server state may have changed; refresh before retrying.`",
              ),
              (
                  "`Bulk Fields edit finished: ${ succeeded } verified, ${ failedPostIds.length } failed, ${ notAttemptedIds.length } not attempted.` +",
                  "`Bulk Fields edit finished: ${ succeeded } verified, ${ failedPostIds.length } unverified, ${ notAttemptedIds.length } not attempted.` +",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'unexpected runtime fragment count for {old!r}: {count}')
              source = source.replace(old, new, 1)
          runtime.write_text(source)
          PY

      - name: Install locked admin graph
        run: npm ci --ignore-scripts

      - name: Format hardened runtime
        run: npx prettier --write admin-ui/src/columns-runtime.ts

      - name: Formatter gate
        run: npx prettier --check admin-ui/src/columns-runtime.ts

      - name: JavaScript lint gate
        run: npm run lint:js

      - name: TypeScript gate
        run: npm run typecheck

      - name: Admin build gate
        run: npm run build:admin

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          extensions: dom, filter, libxml, mbstring, tokenizer, xml, xmlreader, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install locked PHP graph
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Focused bulk contract
        run: vendor/bin/phpunit tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php

      - name: Enforce narrow patch scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -v '^admin-ui/src/columns-runtime.ts$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected modified paths:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-ui/src/columns-runtime.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: classify uncertain bulk writes as unverified'
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
