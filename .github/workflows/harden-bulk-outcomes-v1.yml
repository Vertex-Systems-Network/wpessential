name: Harden Bulk Outcomes V1

on:
  push:
    branches:
      - agent/columns-fields-bulk-edit-v1
    paths:
      - .github/workflows/harden-bulk-outcomes-v1.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/columns-fields-bulk-edit-v1
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "wpessential-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Harden ambiguous outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path('admin-ui/src/columns-runtime.ts')
          text = runtime.read_text()
          replacements = {
              'const failedPostIds: number[] = [];': 'const unverifiedPostIds: number[] = [];',
              'failedPostIds.push( postId );': 'unverifiedPostIds.push( postId );',
              'failedPostIds.length > 0': 'unverifiedPostIds.length > 0',
              "` Failed post IDs: ${ failedPostIds.join( ', ' ) }.`": "` Unverified post IDs: ${ unverifiedPostIds.join( ', ' ) }.`",
              '${ failedPostIds.length } failed': '${ unverifiedPostIds.length } unverified',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing runtime anchor: {old}')
              text = text.replace(old, new)
          runtime.write_text(text)

          test = Path('tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php')
          text = test.read_text()
          replacements = {
              'testAttemptedBulkMutationReportsPartialFailuresAndInvalidatesPreview': 'testAttemptedBulkMutationReportsUnverifiedOutcomesAndInvalidatesPreview',
              "'const failedPostIds: number[] = [];',": "'const unverifiedPostIds: number[] = [];',",
              "'failedPostIds.push( postId );',": "'unverifiedPostIds.push( postId );',",
              "'Bulk Fields edit finished:',": "'Unverified post IDs:',",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing test anchor: {old}')
              text = text.replace(old, new)
          test.write_text(text)

          doc = Path('docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md')
          text = doc.read_text()
          replacements = {
              '## Execution and partial failures': '## Execution and partial or ambiguous outcomes',
              'A failed row does not make previous successful owner writes disappear and is never misreported as success. The operator receives a bounded summary containing:': 'A row without fully verified client evidence is never reported as success. This includes explicit owner rejection as well as transport/stale/malformed-response cases where the browser cannot prove whether a server-side mutation committed. The operator receives a bounded summary containing:',
              '- failed post ids;': '- unverified post ids (not asserted as definitely unchanged);',
              'partial failure, or all-failure': 'partial/unverified outcomes, or no verified successes',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing doc anchor: {old}')
              text = text.replace(old, new)
          doc.write_text(text)
          PY
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked admin graph
        run: npm ci
      - name: Format and validate runtime
        run: |
          npx prettier --write admin-ui/src/columns-runtime.ts
          npm run lint:js
          npm run typecheck
          npm run build
      - name: Remove helper and commit
        run: |
          git rm .github/workflows/harden-bulk-outcomes-v1.yml
          git add admin-ui/src/columns-runtime.ts tests/Unit/Modules/AdminColumns/AdminColumnsFrontendFieldsBulkEditContractTest.php docs/IMPLEMENTATION/ADMIN-COLUMNS-FIELDS-BULK-EDIT-V1.md
          git commit -m "Harden bulk edit ambiguous outcome reporting"
          git push origin HEAD:agent/columns-fields-bulk-edit-v1
