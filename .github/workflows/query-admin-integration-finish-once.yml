          PHP

          cat > tests/e2e/specs/query-builder.spec.mjs <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import process from 'node:process';

          import AxeBuilder from '@axe-core/playwright';
          import { expect, test } from '@playwright/test';
          import { runCLI } from '@wp-playground/cli';

          const pluginDirectory = process.env.WPE_E2E_PLUGIN_DIR;
          if (!pluginDirectory) {
            throw new Error('WPE_E2E_PLUGIN_DIR must point to the unpacked WPEssential distributable.');
          }

          let playground;

          async function visitQueryBuilder(page) {
            const response = await page.goto(
              `${playground.serverUrl}/wp-admin/admin.php?page=wpessential-query`,
              { waitUntil: 'domcontentloaded' },
            );
            expect(response, 'Query Builder navigation should return a response.').not.toBeNull();
            expect(response?.ok(), 'Query Builder should return a successful HTTP response.').toBe(true);
            const root = page.locator('#wpessential-query-root');
            await expect(root).toBeVisible();
            return root;
          }

          test.beforeAll(async () => {
            playground = await runCLI({
              command: 'server',
              port: 0,
              quiet: true,
              skipBrowser: true,
              mount: [
                {
                  hostPath: pluginDirectory,
                  vfsPath: '/wordpress/wp-content/plugins/wpessential',
                },
                {
                  hostPath: path.resolve(process.cwd(), 'fixtures/query-module-fixture.php'),
                  vfsPath: '/wordpress/wp-content/plugins/wpe-query-e2e/wpe-query-e2e.php',
                },
              ],
              blueprint: {
                preferredVersions: { php: '8.2', wp: '7.1' },
                login: true,
                steps: [
                  { step: 'activatePlugin', pluginPath: '/wordpress/wp-content/plugins/wpe-query-e2e/wpe-query-e2e.php' },
                  { step: 'activatePlugin', pluginPath: '/wordpress/wp-content/plugins/wpessential/wpessential.php' },
                ],
              },
            });
          });

          test.afterAll(async () => {
            await playground?.server?.close();
          });

          test('packaged Query Builder is reachable, enhanced, bounded, and execution-disabled', async ({ page }) => {
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            const root = await visitQueryBuilder(page);
            await expect(page.getByRole('heading', { name: 'Query Builder', level: 1 })).toBeVisible();
            await expect(root).toHaveAttribute('data-wpessential-surface', 'query');
            await expect(root).toHaveAttribute('data-wpessential-enhanced', 'ready');
            await expect(page.getByLabel('Data source')).toHaveValue('wordpress.posts');
            await expect(page.getByLabel('Page size')).toHaveValue('20');
            const execute = page.getByRole('button', { name: 'Preview execution unavailable' });
            await expect(execute).toBeDisabled();
            await expect(page.locator('#wpessential-query-bootstrap')).toContainText('wordpress.posts');
            expect(pageErrors, `Unexpected Query Builder browser errors: ${pageErrors.join(' | ')}`).toEqual([]);
          });

          test('packaged Query Builder has zero axe violations', async ({ page }) => {
            await visitQueryBuilder(page);
            const results = await new AxeBuilder({ page }).include('#wpessential-query-root').analyze();
            const evidenceDirectory = path.resolve(process.cwd(), 'test-results');
            await fs.mkdir(evidenceDirectory, { recursive: true });
            await fs.writeFile(
              path.join(evidenceDirectory, 'axe-query-builder.json'),
              `${JSON.stringify(results, null, 2)}\n`,
              'utf8',
            );
            const summary = results.violations.map((violation) => ({
              id: violation.id,
              impact: violation.impact,
              help: violation.help,
              targets: violation.nodes.map((node) => node.target),
            }));
            expect(
              results.violations,
              `Axe violations in WPE-owned Query Builder:\n${JSON.stringify(summary, null, 2)}`,
            ).toEqual([]);
          });
          JS

          cat > docs/IMPLEMENTATION/QUERY-ADMIN-INTEGRATION-V1.md <<'EOF'
          # Query Admin Integration V1

          Status: canonical packaged admin route for the non-runtime Surface 6 Query authoring scaffold.

          ## Runtime boundary

          The admitted Query module registers a `QueryAdminController` under the shared WPEssential admin shell at `wpessential-query`. The controller uses `QueryAdminBootstrapProjector` to expose only the canonical `wordpress.posts` Data Source metadata required by the existing authoring scaffold.

          The bootstrap includes a server-owned draft identity, semantic field references/logical types, advertised predicates, capability version, page-size bound, and Relations-support flag. Authorization mappings, provider internals, storage identifiers, cache keys, SQL, and executable provider arguments are not projected.

          ## Build and enqueue

          `admin-ui/src/query` is a production `wp-scripts` entry and is enqueued only for the Query admin screen through the shared `AdminAssetManifest`. Other WPEssential admin screens do not receive the Query bundle.

          ## Execution remains disabled

          This tranche does not add REST/AJAX execution, save/status routes, nonce-protected mutations, or provider invocation. The internal `module.query.authorized-executor` remains internal. The rendered UI continues to expose the disabled `Preview execution unavailable` control.

          ## Evidence

          Unit coverage verifies deterministic fail-closed bootstrap projection. Packaged Browser E2E activates the Pro Query module through a test-only pre-boot admission fixture, loads the actual distributable route, requires progressive enhancement, confirms `wordpress.posts` metadata and the page-size bound, asserts execution remains disabled, and captures axe accessibility evidence.
          EOF

          rm -f .github/workflows/query-admin-integration-finish-once.yml
      - name: Commit finished Query admin lane
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frameworks/Modules/Query/QueryAdminBootstrapProjector.php frameworks/Modules/Query/QueryAdminController.php frameworks/Modules/Query/QueryModule.php package.json tests/Unit/Modules/Query/QueryAdminBootstrapProjectorTest.php tests/e2e/fixtures/query-module-fixture.php tests/e2e/specs/query-builder.spec.mjs docs/IMPLEMENTATION/QUERY-ADMIN-INTEGRATION-V1.md .github/workflows/query-admin-integration-finish-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(query): integrate packaged admin authoring route"
          git push origin HEAD:agent/query-admin-integration-v1
