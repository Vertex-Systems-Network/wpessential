name: Query Admin Integration Finish Once

on:
  push:
    branches:
      - agent/query-admin-integration-v1

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claimed branch
        uses: actions/checkout@v4
        with:
          ref: agent/query-admin-integration-v1
          fetch-depth: 0
      - name: Build Query admin integration source and evidence
        shell: bash
        run: |
          cat > frameworks/Modules/Query/QueryAdminBootstrapProjector.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace WPEssential\Modules\Query;

          if (!defined('ABSPATH')) {
              exit;
          }

          use WPEssential\Contracts\DataSourceRegistryInterface;
          use WPEssential\Platform\DataSources\DataSourceDescriptor;

          final readonly class QueryAdminBootstrapProjector
          {
              private const DRAFT_UUID = '00000000-0000-4000-8000-000000000006';

              public function __construct(private DataSourceRegistryInterface $dataSources) {}

              /** @return array<string,mixed> */
              public function project(): array
              {
                  $sources = [];
                  $descriptor = $this->dataSources->find(WordPressPostsQueryCompiler::SOURCE_REF);
                  if ($descriptor instanceof DataSourceDescriptor && $descriptor->isAvailable()) {
                      $sources[] = $this->projectSource($descriptor);
                  }

                  return [
                      'surface' => 'query',
                      'identity' => [
                          'uuid' => self::DRAFT_UUID,
                          'key' => 'query-admin-draft',
                          'name' => 'Query admin draft',
                          'revision' => 1,
                          'lifecycle' => 'draft',
                      ],
                      'sources' => $sources,
                  ];
              }

              /** @return array<string,mixed> */
              private function projectSource(DataSourceDescriptor $descriptor): array
              {
                  $schema = $descriptor->fieldSchema;
                  ksort($schema, SORT_STRING);
                  $fields = [];
                  foreach ($schema as $reference => $logicalType) {
                      $fields[] = [
                          'ref' => $reference,
                          'label' => $this->label($reference),
                          'logicalType' => $logicalType,
                      ];
                  }

                  return [
                      'sourceRef' => $descriptor->id,
                      'sourceType' => $descriptor->sourceType,
                      'capabilityVersion' => $descriptor->capabilityVersion,
                      'label' => $this->label($descriptor->id),
                      'fields' => $fields,
                      'predicates' => array_values($descriptor->predicates),
                      'maxPageSize' => $descriptor->maxPageSize,
                      'supportsRelations' => $descriptor->supportsRelations,
                  ];
              }

              private function label(string $reference): string
              {
                  return ucwords(str_replace(['.', '_', '-'], ' ', $reference));
              }
          }
          PHP

          cat > frameworks/Modules/Query/QueryAdminController.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace WPEssential\Modules\Query;

          if (!defined('ABSPATH')) {
              exit;
          }

          use WPEssential\Platform\Admin\AdminAssetManifest;
          use WPEssential\Platform\Admin\PlatformAdminController;

          final class QueryAdminController
          {
              public const PAGE_SLUG = 'wpessential-query';
              private const CAPABILITY = 'manage_options';

              private ?string $hookSuffix = null;

              public function __construct(
                  private readonly QueryAdminBootstrapProjector $bootstrap,
                  private readonly AdminAssetManifest $assets,
              ) {}

              public function register(): void
              {
                  if (!function_exists('add_action')) {
                      return;
                  }

                  add_action('admin_menu', [$this, 'registerMenu']);
                  add_action('admin_enqueue_scripts', [$this, 'enqueueAssets']);
              }

              public function registerMenu(): void
              {
                  if (!function_exists('add_submenu_page')) {
                      return;
                  }

                  $hook = add_submenu_page(
                      PlatformAdminController::PAGE_SLUG,
                      __('Query Builder', 'wpessential'),
                      __('Query Builder', 'wpessential'),
                      self::CAPABILITY,
                      self::PAGE_SLUG,
                      [$this, 'render'],
                  );
                  $this->hookSuffix = is_string($hook) && $hook !== '' ? $hook : null;
              }

              public function enqueueAssets(string $hookSuffix): void
              {
                  if ($this->hookSuffix === null || $hookSuffix !== $this->hookSuffix) {
                      return;
                  }

                  $entry = $this->assets->entry('query');
                  if ($entry === null) {
                      return;
                  }
                  $version = $entry['version'] ?? (defined('WPE_VERSION') ? (string) WPE_VERSION : null);
                  foreach ($entry['styles'] as $index => $style) {
                      wp_enqueue_style('wpessential-query-admin-' . $index, $style, [], $version);
                  }
                  wp_enqueue_script(
                      'wpessential-query-admin',
                      $entry['script'],
                      $entry['dependencies'],
                      $version,
                      true,
                  );
                  if (function_exists('wp_script_add_data')) {
                      wp_script_add_data('wpessential-query-admin', 'strategy', 'defer');
                  }
              }

              public function render(): void
              {
                  if (!function_exists('current_user_can') || !current_user_can(self::CAPABILITY)) {
                      if (function_exists('wp_die')) {
                          wp_die(
                              esc_html__('You are not allowed to manage WPEssential Queries.', 'wpessential'),
                              esc_html__('WPEssential', 'wpessential'),
                              ['response' => 403],
                          );
                      }
                      return;
                  }

                  $bootstrap = $this->bootstrap->project();
                  $json = function_exists('wp_json_encode')
                      ? wp_json_encode($bootstrap, JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT)
                      : json_encode($bootstrap, JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT);
                  $json = is_string($json) ? $json : '{}';

                  echo '<div class="wrap wpessential-query-wrap">';
                  echo '<section id="wpessential-query-root" data-wpessential-surface="query" aria-labelledby="wpessential-query-page-title">';
                  echo '<h1 id="wpessential-query-page-title">' . esc_html__('Query Builder', 'wpessential') . '</h1>';
                  echo '<p>' . esc_html__('Author a bounded Query definition from registered data-source metadata. Execution preview remains unavailable.', 'wpessential') . '</p>';
                  echo '</section>';
                  echo '<script id="wpessential-query-bootstrap" type="application/json">' . $json . '</script>';
                  echo '</div>';
              }
          }
          PHP

          python3 - <<'PY'
          import json
          from pathlib import Path

          module = Path('frameworks/Modules/Query/QueryModule.php')
          text = module.read_text()
          use_anchor = "use WPEssential\\Platform\\Auth\\PolicyEngine;\n"
          if "use WPEssential\\Platform\\Admin\\AdminAssetManifest;" not in text:
              text = text.replace(use_anchor, "use WPEssential\\Platform\\Admin\\AdminAssetManifest;\n" + use_anchor, 1)
          old = "    public function boot(ServiceRegistryInterface $services): void\n    {\n        // V1 execution remains an internal service. REST/admin/public exposure is a later tranche.\n    }\n"
          new = "    public function boot(ServiceRegistryInterface $services): void\n    {\n        $assets = $services->get('platform.admin.assets');\n        $dataSources = $services->get(self::DATA_SOURCE_SERVICE);\n        if (!$assets instanceof AdminAssetManifest || !$dataSources instanceof DataSourceRegistryInterface) {\n            throw new LogicException('Query admin requires canonical shared admin assets and Data Source Registry.');\n        }\n\n        $admin = new QueryAdminController(new QueryAdminBootstrapProjector($dataSources), $assets);\n        $services->set('module.query.admin', $admin);\n        $admin->register();\n        // Query execution remains an internal service. No REST/AJAX/admin execution endpoint is exposed here.\n    }\n"
          if old not in text:
              raise SystemExit('QueryModule boot anchor missing')
          text = text.replace(old, new, 1)
          module.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['build:admin'] = 'wp-scripts build admin-ui/src/main admin-ui/src/taxonomy admin-ui/src/fields admin-ui/src/query --output-path=assets/admin'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY

          cat > tests/Unit/Modules/Query/QueryAdminBootstrapProjectorTest.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace WPEssential\Tests\Unit\Modules\Query;

          use PHPUnit\Framework\TestCase;
          use WPEssential\Modules\Query\QueryAdminBootstrapProjector;
          use WPEssential\Modules\Query\WordPressPostsQueryCompiler;
          use WPEssential\Platform\DataSources\DataSourceDescriptor;
          use WPEssential\Platform\DataSources\DataSourceRegistry;

          final class QueryAdminBootstrapProjectorTest extends TestCase
          {
              public function testProjectsOnlyCanonicalWordPressPostsSourceWithoutSensitiveRuntimeMetadata(): void
              {
                  $registry = new DataSourceRegistry();
                  $registry->register(new DataSourceDescriptor(
                      id: WordPressPostsQueryCompiler::SOURCE_REF,
                      sourceType: WordPressPostsQueryCompiler::SOURCE_REF,
                      capabilityVersion: 1,
                      fieldSchema: ['post.title' => 'string', 'post.id' => 'integer'],
                      predicates: ['eq', 'neq', 'contains'],
                      sortModes: ['field'],
                      paginationModes: ['offset'],
                      supportsRelations: true,
                      maxPageSize: 100,
                      maxBatchSize: 100,
                  ));
                  $registry->register(new DataSourceDescriptor(
                      id: 'example.external',
                      sourceType: 'example.external',
                      capabilityVersion: 1,
                      fieldSchema: ['example.id' => 'integer'],
                  ));

                  $bootstrap = (new QueryAdminBootstrapProjector($registry))->project();

                  self::assertSame('query', $bootstrap['surface']);
                  self::assertSame('draft', $bootstrap['identity']['lifecycle']);
                  self::assertCount(1, $bootstrap['sources']);
                  $source = $bootstrap['sources'][0];
                  self::assertSame(WordPressPostsQueryCompiler::SOURCE_REF, $source['sourceRef']);
                  self::assertSame(['post.id', 'post.title'], array_column($source['fields'], 'ref'));
                  self::assertSame(['eq', 'neq', 'contains'], $source['predicates']);
                  self::assertTrue($source['supportsRelations']);
                  self::assertArrayNotHasKey('authorization', $source);
                  self::assertArrayNotHasKey('cacheGenerationKeys', $source);
              }

              public function testMissingCanonicalSourceProducesEmptyFailClosedSourceList(): void
              {
                  $bootstrap = (new QueryAdminBootstrapProjector(new DataSourceRegistry()))->project();
                  self::assertSame([], $bootstrap['sources']);
              }
          }
          PHP

          mkdir -p tests/e2e/fixtures
          cat > tests/e2e/fixtures/query-module-fixture.php <<'PHP'
          <?php
          /**
           * Plugin Name: WPE Query E2E Fixture
           */

          declare(strict_types=1);

          add_action('plugins_loaded', static function (): void {
              if (!class_exists(\WPEssential\Bootstrap\Plugin::class)) {
                  return;
              }

              \WPEssential\Bootstrap\Plugin::setModuleActivationPolicy(
                  new class implements \WPEssential\Contracts\ModuleActivationPolicyInterface {
                      public function allows(\WPEssential\Platform\Modules\ModuleManifest $manifest): bool
