name: Temporary PR197 strict reorder fix

on:
  push:
    branches:
      - agent/columns-admin-authoring-scaffold-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/columns-admin-authoring-scaffold-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          check-latest: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Replace unsafe indexed swaps with guarded moves
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin-ui/src/columns.ts')
          text = path.read_text(encoding='utf-8')
          old_up = """\t\t\tup.addEventListener( 'click', () => {\n\t\t\t\tif ( index > 0 ) {\n\t\t\t\t\t[ draft.columns[ index - 1 ], draft.columns[ index ] ] = [\n\t\t\t\t\t\tdraft.columns[ index ],\n\t\t\t\t\t\tdraft.columns[ index - 1 ],\n\t\t\t\t\t];\n\t\t\t\t\trenderColumns();\n\t\t\t\t}\n\t\t\t} );\n"""
          new_up = """\t\t\tup.addEventListener( 'click', () => {\n\t\t\t\tif ( index > 0 ) {\n\t\t\t\t\tconst current = draft.columns[ index ];\n\t\t\t\t\tconst previous = draft.columns[ index - 1 ];\n\t\t\t\t\tif ( current === undefined || previous === undefined ) {\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}\n\t\t\t\t\tdraft.columns[ index - 1 ] = current;\n\t\t\t\t\tdraft.columns[ index ] = previous;\n\t\t\t\t\trenderColumns();\n\t\t\t\t}\n\t\t\t} );\n"""
          old_down = """\t\t\tdown.addEventListener( 'click', () => {\n\t\t\t\tif ( index < draft.columns.length - 1 ) {\n\t\t\t\t\t[ draft.columns[ index ], draft.columns[ index + 1 ] ] = [\n\t\t\t\t\t\tdraft.columns[ index + 1 ],\n\t\t\t\t\t\tdraft.columns[ index ],\n\t\t\t\t\t];\n\t\t\t\t\trenderColumns();\n\t\t\t\t}\n\t\t\t} );\n"""
          new_down = """\t\t\tdown.addEventListener( 'click', () => {\n\t\t\t\tif ( index < draft.columns.length - 1 ) {\n\t\t\t\t\tconst current = draft.columns[ index ];\n\t\t\t\t\tconst next = draft.columns[ index + 1 ];\n\t\t\t\t\tif ( current === undefined || next === undefined ) {\n\t\t\t\t\t\treturn;\n\t\t\t\t\t}\n\t\t\t\t\tdraft.columns[ index ] = next;\n\t\t\t\t\tdraft.columns[ index + 1 ] = current;\n\t\t\t\t\trenderColumns();\n\t\t\t\t}\n\t\t\t} );\n"""
          if old_up not in text or old_down not in text:
              raise SystemExit('expected reorder blocks not found; refusing broad edit')
          text = text.replace(old_up, new_up, 1).replace(old_down, new_down, 1)
          path.write_text(text, encoding='utf-8')

      - name: Normalize and validate source
        run: |
          npm run lint:js -- --fix
          npm run typecheck
          npm run lint:css

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-columns-reorder-pr197.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-ui/src/columns.ts .github/workflows/tmp-fix-columns-reorder-pr197.yml
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m "fix(columns): guard strict reorder indices"
          git push origin HEAD:agent/columns-admin-authoring-scaffold-v1
